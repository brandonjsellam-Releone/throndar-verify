[workspace]
members = ["crates/tv-core", "crates/tv-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# Spec §4.3: traits for the duplicate-rejecting input visitor, no derive required.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
# Spec §4.3: strict syntax/string decoder. raw_value preserves number spelling.
serde_json = { version = "=1.0.151", features = ["raw_value"] }
# Constitution §3 and spec §4.5: typed library errors; no input in messages.
thiserror = "=2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
disallowed_types = "forbid"
disallowed_methods = "forbid"
