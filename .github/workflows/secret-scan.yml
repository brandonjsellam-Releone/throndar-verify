name: secret-scan

# Every secret this repo could leak is already public if it leaks once, so the scan runs over the
# full history of every ref the remote advertises (refs/pull/* included, since 2026-10-08), and over
# every commit and tag message, rather than the pushed range. A credential committed and later
# "removed" is still in the git objects, and range-scoped scanning is exactly how those get missed.
# What it still cannot see is listed under WHAT THESE CHECKS STILL CANNOT DO, below.
#
# Added 2026-08-13: this repo had no secret scanning on any trigger. Nothing was leaking — the
# history was scanned with gitleaks 8.30.1 before this was written, and every finding traced to a
# false positive. The point of adding it now is that nothing would have caught the first real one.
#
# 2026-09-17: the gitleaks/gitleaks-action@v2.3.7 step that used to be here declared no inputs, so
# the `fail` and `log-opts` values below it were silently discarded ("Unexpected input(s)" in the
# logs). It scanned a commit range, not the history, and it ran gitleaks 8.16.1. It is replaced by
# a pinned, SHA-256-verified gitleaks 8.30.1 that is invoked directly, plus a teeth check that
# fails if the scan can no longer reach a finding on another ref.
#
# 2026-09-18: the teeth check scans a repository it builds itself, so it cannot see the checkout of
# THIS repository. A shallow checkout, or a --log-opts that filters by path, left the teeth check
# green while the real scan walked almost nothing.
#
# 2026-09-18, second pass: the first attempt at that closed it with a count — gitleaks' reported
# "N commits scanned" had to equal `git rev-list --all --no-merges --count`. Those two numbers can
# differ for honest reasons: gitleaks only counts a commit whose diff carries added content, so a
# pure deletion, a mode-only change or an empty merge lowers its figure while the walk is complete.
# Reproduced on a repository holding exactly those three: gitleaks reported 2, the gate expected 4,
# and the job went red on an honest push. The count is no longer compared to the repository.
#
# 2026-09-18, third pass — two holes in the scope probe that replaced the count:
#   1. It planted its canary on refs/heads/ci-scope-probe. A walk narrowed from --all to --branches,
#      or to a refs/heads glob, still reaches refs/heads/*, so that narrowing passed the probe.
#      The canary now goes on refs/trelyan/scope-probe: outside refs/heads/ and refs/tags/, where
#      only a walk over EVERY ref finds it.
#   2. The probe ran its own gitleaks. The command that actually scanned the repository was a
#      separate step, so narrowing that second command's --log-opts left every gate green — the
#      probe proved nothing about the scan that matters. There is now ONE invocation that scans
#      this repository's history: the command that has to find a real secret is the command that
#      has to find the probe.
#
# 2026-09-18, fourth pass — two more, both found by adversarial review of the third:
#   1. NEITHER canary tripped a real gitleaks rule, so no gate exercised a single detector from
#      gitleaks' default ruleset. The probe commit now also carries a throwaway PEM private key,
#      generated inside the job, which is matched by the `private-key` rule of the ruleset itself.
#   2. The walk was a job-level knob (GITLEAKS_LOG_OPTS), and "--all --author=ci" in that variable
#      would have isolated every canary while walking one commit in eighteen. The variable is gone:
#      the log-opts are written into each invocation.
#
# 2026-09-18, FIFTH pass — three holes, every one of them reproduced against the committed step
# bodies of the fourth, with a real AWS key pair sitting in the repository's history and the job
# GREEN. The step bodies were extracted from the committed YAML with PyYAML and run under a
# runner-shaped harness; the numbers quoted below are from those runs.
#
#   1. INHERITED PATH ALLOWLIST, AND BINARY BLINDNESS. The scan ran on gitleaks' DEFAULT config,
#      whose global [allowlist] carries 25 path patterns nobody here reviewed — among them
#      '(?i)\.(?:docx?|xlsx?|pdf|bin|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe|gltf)$'. The identical
#      credential pair gave: docs/architecture.pdf → 2 findings, rc=0 "scan clean"; docs/notes.bin
#      → 2 findings, rc=0; deploy.env → 3 findings, rc=1 CAUGHT. The only variable was the
#      filename. Separately, a file holding a NUL byte (logo.dat) was invisible for a different
#      reason: git renders its diff as "Binary files differ", so gitleaks was handed no content at
#      all — it reported 17 commits where the honest run reported 18, i.e. the offending commit
#      looked empty. And the failure text asserted "Everything else is a secret in this history",
#      a completeness the command did not have.
#      Closed three ways, all three demonstrated: (a) the ruleset is now a VENDORED, SHA-256-pinned
#      copy of upstream's, with 24 of upstream's 25 global path patterns deleted — what is left is
#      '(?:^|/)\.git$' (upstream's, and belt-and-braces: gitleaks' dir walker skips .git anyway --
#      a PEM planted in .git/description is not reported with or without it) and one entry added
#      here for the vendored file itself (that entry was itself a hole and is gone — SIXTH pass,
#      below), which is 3200 lines of
#      detection patterns that match each other (upstream allowlists 'gitleaks\.toml' for the same
#      reason; without it the honest tree reports aws-amazon-bedrock-api-key-short-lived at line 240
#      of that file and the job is red). With the rest gone, the .pdf and .bin credentials are
#      found where they previously were not; (b) the walk
#      passes --text, so git renders binary diffs as text and the NUL-byte case is found (16 → 17
#      commits, 0 → 1 finding); (c) a second, path-mode pass over the checked-out tip, which does
#      not go through git's diff machinery at all.
#
#   2. INLINE gitleaks:allow. gitleaks honours a trailing `gitleaks:allow` comment by default. The
#      credential pair in deploy.cfg AT THE TIP with that comment: 2 findings, rc=0, GREEN. No
#      config file, no workflow edit, no fingerprint file — one comment in the same commit as the
#      secret. Closed by --ignore-gitleaks-allow on every invocation.
#
#   3. THE RULESET GATE WAS SATISFIED BY THE THING IT TESTED. The "default ruleset is in effect"
#      gate greps the report for the literal RuleID "private-key" — but the run-time config was
#      `[extend] path = <repo>/.gitleaks.toml`, so the REPOSITORY decided which rules existed. A
#      value compared with itself. Three configs each passed that gate with a live key in history:
#      a repo rule merely declaring `id = "private-key"` and nothing else (defaults never loaded,
#      rc=0); `useDefault = true` + `disabledRules = [...]` (rc=0); `useDefault = true` +
#      `[[allowlists]] paths = ['''deploy\.env''']` (rc=0). The honest control — the same tree with
#      `[extend] useDefault = true` and nothing else — was rc=1.
#      Closed by taking the ruleset out of the repository's hands at assembly: the scan config is
#      built HERE as `[extend] path = <the pinned vendored file>`, and .gitleaks.toml can only ADD
#      rules, which are re-emitted field by field from a parsed copy. A .gitleaks.toml that does
#      not set useDefault = true, sets disabledRules, extends somewhere else, collides with a
#      ruleset id, uses a rule field this gate cannot re-emit, or declares an allowlist that is not
#      in .github/gitleaks/allowlist-exceptions.txt, fails the job. It is printed either way.
#      Note what an approved allowlist does and does not do: repository allowlists are never
#      carried into the assembled config at all, so listing one in the exceptions file lets it
#      EXIST (for gitleaks run locally) and nothing more. Verified while writing this — with the
#      `paths = ['''deploy\.env''']` allowlist approved by digest, the config gate passed and the
#      scan still found the planted credential and failed the job.
#
# WHAT THESE CHECKS STILL CANNOT DO — read this before quoting the job as evidence:
#   * The scan is gitleaks' regex ruleset. A credential no rule matches is not found, by any pass,
#     ever. "scan clean" means "no rule in the pinned ruleset matched", and nothing more.
#   * The SHA-256 pin proves the vendored file has not changed since it was reviewed. It does NOT
#     prove the file is faithful to upstream — only reading the diff does. The upstream URL and
#     upstream sha256 are recorded in the file's header so a reviewer can redo that comparison.
#   * The path-mode pass sees the checked-out TIP only. A credential that was committed into a file
#     git still cannot render, and deleted before the tip, is reachable by neither pass.
#   * --text makes git render binary diffs as text. It does not defeat compression or encoding: a
#     credential inside a .zip, a .png's pixel data, or any encoded blob is not plaintext in the
#     diff and will not match. Archive traversal is off (--max-archive-depth defaults to 0).
#   * No global allowlist path survives (SIXTH pass, below). The vendored ruleset's self-matches are
#     accepted by digest, which trusts that every digest listed in the workflow is a version someone
#     actually reviewed against upstream.
#   * .gitleaksignore still suppresses, by design, and the config gate prints its contents rather
#     than policing them. It is a committed file, so each entry is a reviewed line — but it IS
#     repository-controlled subtraction, and gitleaks 8.30.1 accepts two forms with very different
#     reach: `commit:path:rule:line` suppresses one finding in one commit, while the commit-less
#     `path:rule:line` suppresses that rule at that path and line in EVERY commit, past and future
#     (reproduced in review: one such line turned a red run with a live key in history green).
#   * The repository-config gate parses TOML with Python's tomllib; gitleaks parses it in Go. The
#     scan runs on this gate's RE-EMISSION, not on the repository's file, so a disagreement between
#     the two parsers changes what is scanned rather than slipping past the check — but it is a
#     disagreement, and a rule this gate cannot re-emit is rejected rather than guessed at.
#   * None of this is externally audited. Every statement here is self-attested and reproduced only
#     by the runs described above.
#
# 2026-10-08, SIXTH pass — three more holes, each reproduced against the committed step bodies of the
# fifth (extracted with PyYAML, byte-compared, run under the same kind of runner-shaped harness, with
# gitleaks 8.30.1 and the real repository's refs, refs/pull/* included), with the same AWS key pair
# reachable and the job GREEN:
#
#   1. THE FIFTH PASS'S OWN ALLOWLIST ENTRY. '(?:^|/)\.github/gitleaks/gitleaks-default-8\.30\.1\.toml$'
#      matches at ANY directory boundary, so a credential in docs/.github/gitleaks/gitleaks-default-
#      8.30.1.toml was excluded from both passes while the pin hashed only the copy at the root —
#      JOB GREEN committed-and-deleted, and JOB GREEN with the plaintext sitting in the tip. Anchoring
#      it does not close it: the pin covers the TIP's bytes only, so a credential committed at the root
#      path and reverted before the tip was GREEN too (reproduced against the fifth pass, and against a
#      variant of it with the entry anchored by ^ — which also turned the honest tree RED, because
#      path mode reports absolute paths). Closed by deleting the entry: the vendored file is now
#      scanned like every other file, and its self-matches are accepted BY VALUE — only at exactly
#      $GITLEAKS_CONFIG, and only when the bytes at that path in that commit hash to the pin or to a
#      digest listed in GITLEAKS_CONFIG_PRIOR_SHA256. Both passes now classify every finding instead
#      of counting them. The same review found upstream's '(?:^|/)\.git$' entry hiding a blob at
#      sub/.git in a tree built with `git mktree` (the porcelain refuses such a path; plumbing does
#      not; whether GitHub accepts the push was not tested). gitleaks' dir walker already skips .git
#      directories, so that entry only ever acted in git mode, where it was a hole: it is deleted
#      too, and the global path list is now empty.
#   2. COMMIT AND TAG MESSAGES WERE SCANNED BY NOTHING. gitleaks' git mode parses patch bodies out of
#      `git log -p`; the message is preamble and reaches no rule, and path mode reads files. A key in
#      a commit message, or in an annotated tag's message, was GREEN — measured on gitleaks 8.30.1
#      directly as well: zero findings for both, while the same text in a file is found. Closed by a
#      METADATA pass: every commit and tag object in the object database is written out raw and
#      scanned with the same config. It has its own canaries — the probe commit's message carries the
#      marker and the throwaway key, and a probe tag object carries the marker — and every object the
#      walk reaches must appear in the dump, so a pass that read nothing, or skipped tags, is red.
#      Attacking that pass found one more blind spot of the same kind, in every pass old and new: a
#      blob that a ref or tag reaches with NO commit in between (`git tag x <blob>`, or a tag of a
#      tree) is never diffed by git log — a key there gave zero findings. The metadata pass writes
#      those blobs out too, and a third probe ref points straight at the marker blob so that part of
#      the pass has a canary of its own.
#   3. THE WALK COULD NOT SEE REFS THE CHECKOUT NEVER FETCHED. actions/checkout fetches refs/heads/*
#      and refs/tags/* only, so --all walked every ref of the CHECKOUT. A commit that reaches GitHub
#      only through refs/pull/N/head — a fork PR, or a branch deleted after its PR — was never scanned:
#      JOB GREEN while the remote still served the credential. (This repository has five such
#      commits today, the heads of refs/pull/1, 2, 4, 5 and 6; the walk this replaces reached none of
#      them.) Closed by fetching every ref the remote advertises and checking the checkout against
#      `git ls-remote` — the remote's own list — so a narrowed or deleted fetch is a red job.
#   Every closure above was mutation-proven: removing the mechanism reopens the hole (JOB GREEN with
#   the key reachable), or the mechanism's own canary turns the job red.
#
# WHAT THE SIXTH PASS DID NOT CLOSE, in addition to the list above:
#   * Only refs the remote ADVERTISES are fetched. GitHub keeps objects no advertised ref reaches —
#     a commit overwritten by a force-push, a branch deleted without a PR, objects shared across a
#     fork network — and serves them to anyone who has the SHA. None of those is scanned.
#   * The fetch is anonymous (persist-credentials: false). On a private repository it fails, and so
#     does the job; that is fail-closed, not coverage. A push landing between the fetch and the
#     `git ls-remote` comparison is retried three times and then turns the job red.
#   * The metadata pass reads commit and tag OBJECTS. A credential used as a file or directory NAME
#     (a tree entry) is not scanned by any pass, and nothing that is not a git object is scanned at
#     all: pull-request titles and bodies, review and issue comments, release notes, Actions logs and
#     artifacts.
#   * The metadata pass deliberately ignores .gitleaksignore (it points gitleaks at an empty
#     directory); the history scan and the path-mode pass still honour it, as described above.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. gitleaks' ruleset changes without this repo changing, so a scan that only fires on
    # push cannot notice a newly-detectable pattern in code that has been sitting there for months.
    # The ruleset is now pinned, so this trigger no longer picks up upstream rule changes on its
    # own — bumping GITLEAKS_VERSION and re-vendoring the config is a reviewed commit.
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # The ruleset the scan runs on: vendored from upstream v8.30.1, path allowlist trimmed,
      # pinned here so changing it is a reviewed edit and not an input.
      GITLEAKS_CONFIG: ".github/gitleaks/gitleaks-default-8.30.1.toml"
      GITLEAKS_CONFIG_SHA256: "950ee1c637c371017ab3c4fdb6743b25117e469e15a0d16635baf83f06c7eb38"
      # Every EARLIER reviewed version of that file that sits in this repository's history, by
      # SHA-256. The vendored patterns match each other, so the history scan reports them in every
      # commit that added them; such a finding is accepted only at exactly $GITLEAKS_CONFIG and
      # only when the bytes at that path in THAT commit hash to the pin above or to one of these.
      # f047c1a7... is the version 93b4337 committed (round 4). Re-vendoring appends the outgoing
      # pin here in the same reviewed commit.
      GITLEAKS_CONFIG_PRIOR_SHA256: "f047c1a7e816c93d21d753b1c6f7d0e30e996a77c6f161d78a3d0aea79f1a659"
      GITLEAKS_ALLOWLIST_EXCEPTIONS: ".github/gitleaks/allowlist-exceptions.txt"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Required for --log-opts=--all to reach anything but the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The ruleset is an artifact of this repository, not a default inherited at run time. This
      # gate is the whole reason the "is the default ruleset in effect" question is answerable
      # without asking the thing under test: the bytes are fixed here, in the workflow.
      - name: Pinned ruleset gate (the scan's config is this repo's, byte for byte)
        run: |
          set -euo pipefail
          cfg="$GITHUB_WORKSPACE/$GITLEAKS_CONFIG"
          [ -f "$cfg" ] || { echo "::error::$GITLEAKS_CONFIG is missing; the scan has no reviewed ruleset"; exit 1; }
          got=$(sha256sum "$cfg" | cut -d' ' -f1)
          echo "pinned   $GITLEAKS_CONFIG_SHA256"
          echo "measured $got"
          if [ "$got" != "$GITLEAKS_CONFIG_SHA256" ]; then
            echo "::error::$GITLEAKS_CONFIG does not match the SHA-256 pinned in this workflow. If the change is intended, update GITLEAKS_CONFIG_SHA256 in the same commit — that is what makes the ruleset a reviewed edit."
            exit 1
          fi
          echo "$(grep -c '^\[\[rules\]\]' "$cfg") rules; the GLOBAL [allowlist] paths (rule-level allowlists are upstream's and not shown):"
          sed -n '/^\[allowlist\]/,/^\]/p' "$cfg"

      # A repository may ADD detection. It may not subtract it. Everything below is a way of
      # subtracting, and each one was green with a live AWS key in history before this existed.
      # The file is printed either way, so the log shows what was in effect and not just a verdict.
      - name: Repository configuration gate (.gitleaks.toml may only add rules)
        run: |
          set -euo pipefail
          BASE_CONFIG="$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, tomllib

          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base = pathlib.Path(os.environ["BASE_CONFIG"])
          exc_name = os.environ["GITLEAKS_ALLOWLIST_EXCEPTIONS"]
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "repo-rules.toml"
          out.write_text("", encoding="utf-8")   # nothing appended unless a rule survives below

          ign = ws / ".gitleaksignore"
          if ign.is_file():
              entries = [l for l in ign.read_text(encoding="utf-8").splitlines()
                         if l.strip() and not l.lstrip().startswith("#")]
              print(".gitleaksignore: present, %d fingerprint(s) — each one suppresses a real "
                    "finding and is NOT policed by this gate:" % len(entries))
              for l in entries:
                  print("    " + l)
          else:
              print(".gitleaksignore: absent")

          repo = ws / ".gitleaks.toml"
          if not repo.is_file():
              print(".gitleaks.toml: absent — the scan runs on the pinned ruleset alone")
              sys.exit(0)

          text = repo.read_text(encoding="utf-8")
          print("---- .gitleaks.toml (%d bytes, sha256 %s) ----"
                % (len(text.encode()), hashlib.sha256(text.encode()).hexdigest()))
          print(text)
          print("---- end .gitleaks.toml ----")

          try:
              doc = tomllib.loads(text)
          except Exception as e:
              print("::error::.gitleaks.toml is not parseable TOML: %s" % e)
              sys.exit(1)

          bad = []
          ext = doc.get("extend", {})
          if ext.get("useDefault") is not True:
              bad.append("[extend] useDefault is %r, not true: this config does not turn the "
                         "ruleset on, so the scan would run on whatever it happens to define"
                         % (ext.get("useDefault"),))
          for k in ("path", "url"):
              if k in ext:
                  bad.append("[extend] %s = %r: the ruleset is pinned in the workflow and may not "
                             "be redirected from here" % (k, ext[k]))
          for where, d in (("[extend]", ext.get("disabledRules")),
                           ("top level", doc.get("disabledRules"))):
              if d:
                  bad.append("disabledRules at %s is set to %r: that is subtraction" % (where, d))

          base_doc = tomllib.loads(base.read_text(encoding="utf-8"))
          base_ids = {r["id"] for r in base_doc.get("rules", []) if "id" in r}
          print("pinned ruleset: %d rules" % len(base_ids))

          def allowlists(d):
              found = []
              if "allowlist" in d:
                  found.append(("global [allowlist]", d["allowlist"]))
              for i, a in enumerate(d.get("allowlists", []) or []):
                  found.append(("global [[allowlists]] #%d" % i, a))
              for r in d.get("rules", []) or []:
                  rid = r.get("id", "?")
                  if "allowlist" in r:
                      found.append(("rule %s [rules.allowlist]" % rid, r["allowlist"]))
                  for i, a in enumerate(r.get("allowlists", []) or []):
                      found.append(("rule %s [[rules.allowlists]] #%d" % (rid, i), a))
              return found

          approved = set()
          exc = ws / exc_name
          if exc.is_file():
              for line in exc.read_text(encoding="utf-8").splitlines():
                  line = line.split("#", 1)[0].strip().lower()
                  if line:
                      approved.add(line)
          print("reviewed allowlist exceptions in %s: %d" % (exc_name, len(approved)))
          for label, a in allowlists(doc):
              digest = hashlib.sha256(json.dumps(a, sort_keys=True,
                                                 separators=(",", ":")).encode()).hexdigest()
              if digest in approved:
                  print("allowlist %s: approved (%s) — note that the scan does not apply it; "
                        "repository allowlists are never carried into the assembled config"
                        % (label, digest))
              else:
                  bad.append("allowlist %s is not a reviewed exception. Its digest is %s — if "
                             "this allowlist should be allowed to exist (it will not be applied to "
                             "the scan either way), add that line to %s in this review."
                             % (label, digest, exc_name))

          # Re-emission, field by field, from the parsed document. The scan runs on THIS, not on
          # the repository's file: a field this gate does not know how to carry across is rejected
          # rather than passed through, so "unknown" can never mean "allowed".
          SIMPLE = {"id": "str", "description": "str", "regex": "lit", "path": "lit",
                    "entropy": "num", "secretGroup": "int", "keywords": "list", "tags": "list"}
          seen, chunks = set(), []
          for r in doc.get("rules", []) or []:
              rid = r.get("id")
              if not isinstance(rid, str) or not rid:
                  bad.append("a [[rules]] entry has no string id"); continue
              if rid in base_ids:
                  bad.append("rule id %r collides with a rule in the pinned ruleset: a repository "
                             "rule with that id REPLACES it, which is subtraction wearing an "
                             "addition's clothes" % rid)
                  continue
              if rid in seen:
                  bad.append("rule id %r is declared twice" % rid); continue
              seen.add(rid)
              unknown = [k for k in r if k not in SIMPLE]
              if unknown:
                  bad.append("rule %r uses field(s) %s that this gate cannot re-emit; add "
                             "support for them in the workflow in a reviewed commit rather than "
                             "letting them through unchecked. A rule-attached allowlist lands here "
                             "whatever the exceptions file says: it is subtraction, and this gate "
                             "refuses rather than guesses" % (rid, ", ".join(sorted(unknown))))
                  continue
              lines = ["[[rules]]"]
              for k, kind in SIMPLE.items():
                  if k not in r:
                      continue
                  v = r[k]
                  if kind == "lit":
                      if not isinstance(v, str) or "'''" in v:
                          bad.append("rule %r field %s is not a re-emittable string" % (rid, k))
                          break
                      lines.append("%s = '''%s'''" % (k, v))
                  elif kind == "str":
                      lines.append("%s = %s" % (k, json.dumps(str(v))))
                  elif kind in ("num", "int"):
                      lines.append("%s = %s" % (k, v))
                  else:
                      if not isinstance(v, list) or not all(isinstance(x, str) for x in v):
                          bad.append("rule %r field %s is not a list of strings" % (rid, k))
                          break
                      lines.append("%s = [%s]" % (k, ", ".join(json.dumps(x) for x in v)))
              else:
                  chunks.append("\n".join(lines))

          if bad:
              for b in bad:
                  print("::error::.gitleaks.toml: " + b)
              sys.exit(1)
          out.write_text("\n" + "\n\n".join(chunks) + "\n" if chunks else "", encoding="utf-8")
          print("accepted: %d added rule(s) re-emitted into %s" % (len(chunks), out))
          print(out.read_text(encoding="utf-8"))
          PY

      # The teeth check proves a finding reachable only from another ref is found, on a repository
      # it builds itself. It says nothing about the checkout of THIS repository: that is what the
      # full-clone gate and the scan below are for. Its canary matches a rule this step writes, so
      # it says nothing about the pinned ruleset either: the pin and the scan's private-key canary
      # are what carry that. It uses the same assembled config as the scan so that anything the
      # repository adds is exercised here too.
      - name: Teeth check (a planted finding reachable only from another ref must be found)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/teeth"; cfg="$RUNNER_TEMP/teeth.toml"
          rm -rf "$d"; mkdir -p "$d"
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          cat >> "$cfg" <<'EOF'

          [[rules]]
          id = "teeth-canary"
          regex = '''TEETH_CANARY_[0-9]{8}'''
          EOF
          g() { git -C "$d" -c user.name=ci -c user.email=ci@invalid "$@"; }
          g init -q -b main
          echo "planted TEETH_CANARY_12345678" > "$d/planted.txt"
          g add planted.txt && g commit -qm planted
          g checkout -q --orphan clean
          g rm -q --cached planted.txt && rm "$d/planted.txt"
          echo ok > "$d/ok.txt" && g add ok.txt && g commit -qm clean
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --log-opts="--all --text" --exit-code 3 --no-banner "$d"
          rc=$?
          set -e
          [ "$rc" -eq 3 ] || { echo "::error::teeth check expected exit 3, got $rc"; exit 1; }

      # A gate, not a print. actions/checkout defaults to a depth-1 clone, so dropping the fetch-depth: 0
      # above would leave one commit to scan and every other step still green.
      - name: Full-clone gate
        run: |
          set -euo pipefail
          [ "$(git rev-parse --is-shallow-repository)" = false ] || {
            echo "::error::shallow checkout: the scan cannot see history"
            exit 1
          }
          echo "$(git rev-list --all --count) commits reachable from all refs"

      # actions/checkout at the pinned SHA fetches refs/heads/* and refs/tags/* (plus the triggering
      # PR ref) and nothing else — src/ref-helper.ts, getRefSpecForAllHistory(). So --all walked every
      # ref OF THE CHECKOUT, which is not every ref of the repository. A commit that reaches GitHub
      # only through refs/pull/N/head — any fork PR, or a branch deleted after its PR — stays
      # fetchable by anyone for as long as the PR exists, and was never scanned (reproduced: JOB GREEN
      # while the bare remote still served the credential from refs/pull/9/head).
      #
      # So fetch EVERY ref the remote advertises, into a namespace of its own, and then check the
      # result against the remote's own list rather than against the fetch line: every object id
      # `git ls-remote` prints must be the tip of a ref in this checkout, or the job fails naming it.
      # Deleting or narrowing the fetch is therefore a red job, not a quieter scan. The comparison
      # source is the remote, not this checkout, so the pass condition is not supplied by the thing
      # being checked. The fetch is anonymous (persist-credentials: false): on a private repository
      # it fails, and so does this step.
      - name: Every ref the remote advertises is in the walk (refs/pull/* included)
        run: |
          set -euo pipefail
          ns="refs/remotes/remote-all"
          adv="$RUNNER_TEMP/remote-refs.txt"
          # A push landing between the fetch and the listing can leave one tip unfetched for honest
          # reasons, so fetch and compare up to three times before calling it a hole.
          for attempt in 1 2 3; do
            git fetch --quiet --no-tags --no-write-fetch-head --no-recurse-submodules origin "+refs/*:$ns/*"
            git ls-remote origin > "$adv"
            git for-each-ref --format='%(objectname)' | sort -u > "$RUNNER_TEMP/local-tips.txt"
            missing=$(grep -v '\^{}$' "$adv" \
              | while IFS=$'\t' read -r oid name; do
                  grep -qxF "$oid" "$RUNNER_TEMP/local-tips.txt" || printf '%s %s\n' "$oid" "$name"
                done)
            [ -z "$missing" ] && break
            echo "attempt $attempt: not yet in the checkout:"; echo "$missing"
          done
          if [ -n "$missing" ]; then
            echo "::error::the remote advertises refs whose tips are not in this checkout, so the scan below would not walk them:"
            echo "$missing"
            exit 1
          fi
          echo "the remote advertises $(grep -vc '\^{}$' "$adv") refs ($(cut -f2 "$adv" | grep -c '^refs/pull/' || true) under refs/pull/); every tip is a ref in this checkout, $(git rev-list --all --count) commits reachable from all refs"

      # THE history scan of this repository, and the probe that proves its scope AND that the pinned
      # ruleset actually loaded, in ONE gitleaks invocation. That is the point: the command that has
      # to find a real secret is the command that has to find the probe, so there is no second
      # command whose walk can be narrowed behind the gate's back, and the log-opts are written here
      # rather than read from a variable, so narrowing them is the same visible edit as deleting an
      # assertion.
      #
      # The same step then runs a SECOND gitleaks invocation, in path mode, over every commit and tag
      # object written out raw (the metadata pass), because the walk never reads a message. It is not
      # a second walk that could be narrowed behind the first one's back: its input is the object
      # database, it has its own canaries in the probe's commit message and in a probe tag object, and
      # it must have dumped every commit and tag the walk reaches.
      #
      # The probe is one commit on refs/trelyan/scope-probe — outside refs/heads/ and refs/tags/, in
      # files the tip does not contain, dated at the epoch, built with git plumbing so the working tree
      # is never touched and deleted again in a trap. Its tree carries two files:
      #
      #   .ci-scope-probe      a marker matched by a rule this step adds to the run-time config. Only a
      #                        walk over every ref reaches it: --branches, a refs/heads glob, --remotes,
      #                        --tags, -1, a --since or a path filter all miss it.
      #   .ci-scope-probe-key  a throwaway PEM private key generated here, by this job, matched by the
      #                        `private-key` rule of the PINNED ruleset. Nothing in this workflow
      #                        defines that rule, so the finding exists only if the pinned file was
      #                        actually loaded — which is now a statement about a file whose bytes this
      #                        workflow fixes, not about a file the repository supplies.
      #
      # Since 2026-10-08 the probe commit's MESSAGE repeats the marker and the key, an annotated tag
      # object on refs/trelyan/scope-probe-tag carries the marker in its message, and
      # refs/trelyan/scope-probe-blob points straight at the marker blob. Those three are for the
      # metadata pass, which must find each of them; the walk never reads any of them.
      #
      # The key is generated into a shell variable and piped into git: it is never written to the
      # working tree, never committed to any branch, never in the tip's tree, and never pushed — this
      # job holds only `contents: read`, checks out with persist-credentials: false, and pushes
      # nothing. Deleting the refs leaves their objects unreachable on an ephemeral runner.
      #
      # --text is on the walk deliberately: without it git renders a diff touching a file with a NUL
      # byte as "Binary files differ" and gitleaks is handed no content — reproduced, a planted key in
      # such a file was invisible and the commit did not even count.
      - name: gitleaks over every ref, then over every commit and tag MESSAGE (must find the probe's marker AND trip a pinned-ruleset rule in both, and nothing else)
        run: |
          set -euo pipefail
          ref="refs/trelyan/scope-probe"
          tref="refs/trelyan/scope-probe-tag"
          bref="refs/trelyan/scope-probe-blob"
          cfg="$RUNNER_TEMP/scan.toml"
          rep="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          meta="$RUNNER_TEMP/meta"
          mrep="$RUNNER_TEMP/meta-report.json"
          noign="$RUNNER_TEMP/meta-no-ignore-file"
          # Installed for the whole step and never removed: the refs go away whether the assertions
          # below pass, fail, or never run.
          cleanup() {
            git update-ref -d "$ref" 2>/dev/null || true
            git update-ref -d "$tref" 2>/dev/null || true
            git update-ref -d "$bref" 2>/dev/null || true
          }
          trap cleanup EXIT
          for r in "$ref" "$tref" "$bref"; do
            if git rev-parse --verify -q "$r" >/dev/null; then
              echo "::error::$r already exists; the probe would not be distinguishable"
              exit 1
            fi
          done
          # Assembled at run time, and deliberately split: the scannable form must never exist in this
          # repository. If it did, the probe would match this workflow file in the tip's own tree and pass
          # without the scan ever reaching another ref.
          rid='scope''-probe-canary'
          pre='SCOPE_PROBE''_CANARY_'
          mark="${pre}20260918"
          # Workflow-owned. The repository's .gitleaks.toml is NOT extended here: whatever it adds
          # arrives as the rules the config gate re-emitted, and it cannot reach the [extend] line.
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          printf '\n[[rules]]\nid = "%s"\nregex = "%s[0-9]{8}"\n' "$rid" "$pre" >> "$cfg"
          # Plumbing only: nothing is added to the working tree, and the refs are deleted again below.
          # The key exists in a shell variable, on pipes and inside the object database, and nowhere
          # else.
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null) || key=""
          if [ -z "$key" ]; then
            echo "::error::could not generate the probe's throwaway private key; refusing to pass without a ruleset canary"
            exit 1
          fi
          mblob=$(printf 'probe %s\n' "$mark" | git hash-object -w --stdin)
          kblob=$(printf '%s\n' "$key" | git hash-object -w --stdin)
          # An identity of its own. The teeth commits are `ci <ci@invalid>`; if the probe shared that,
          # one author filter would isolate every canary in this workflow at once.
          tree=$(printf '100644 blob %s\t.ci-scope-probe\n100644 blob %s\t.ci-scope-probe-key\n' \
            "$mblob" "$kblob" | git mktree)
          # The commit MESSAGE carries the marker and the key as well, and an annotated tag object on a
          # second ref carries the marker in ITS message (a third ref is added below). gitleaks' git
          # mode never reads either (it parses patch bodies out of `git log -p`); they are there for
          # the metadata pass below, and they are what proves that pass reads commit objects, reads
          # tag objects, and runs the pinned ruleset.
          commit=$(printf 'ci scope probe\n\n%s\n\n%s\n' "$mark" "$key" \
            | GIT_AUTHOR_DATE='@0 +0000' GIT_COMMITTER_DATE='@0 +0000' \
              git -c user.name=trelyan-scope-probe -c user.email=scope-probe@invalid \
              commit-tree "$tree" -F -)
          unset key
          git update-ref "$ref" "$commit"
          ptag=$(printf 'object %s\ntype commit\ntag scope-probe\ntagger trelyan-scope-probe <scope-probe@invalid> 0 +0000\n\nci scope probe tag %s\n' \
            "$commit" "$mark" | git mktag)
          git update-ref "$tref" "$ptag"
          # A third ref points STRAIGHT at the marker blob, with no commit in between, the way
          # `git tag <name> <blob>` does. git log never diffs such a blob; the metadata pass must
          # find the marker in it.
          git update-ref "$bref" "$mblob"
          # One invocation, the workflow's own config, --all --text written here, a JSON report.
          # --ignore-gitleaks-allow: without it a trailing `gitleaks:allow` comment on the line
          # carrying a credential suppresses the finding and this job goes green — reproduced.
          # --exit-code 0 on purpose: the probe guarantees findings, so gitleaks' own exit status
          # cannot be the gate. The report is. A gitleaks that cannot run writes no report, or an
          # empty one, and the assertions below fail on that too.
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --log-opts="--all --text" --redact=100 --verbose --no-banner \
            --exit-code 0 --report-path "$rep" . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          [ -f "$rep" ] || { echo "::error::gitleaks wrote no report (exit $rc)"; exit 1; }
          # The METADATA pass. A credential pasted into a commit message or an annotated tag's message
          # is in the history, is what `git log` prints and what GitHub's commit page renders, and the
          # walk above never sees it — reproduced: JOB GREEN for both. So every commit and tag object
          # in the object database (after the every-ref fetch, that is every advertised ref's history,
          # plus the probe) is written out raw — headers, author, committer, signature, message — one
          # file per object, and scanned in path mode with the same config. The object list comes from
          # the object database itself, not from a walk; the walk is used only to check it below.
          # It also writes out every blob that a ref or a tag object reaches WITHOUT a commit in
          # between (`git tag <name> <blob>`, or a tag of a tree): git log never diffs those, so a
          # credential there was invisible to every pass -- found while attacking this pass, and
          # reproduced with gitleaks 8.30.1: zero findings for a key in a tagged blob or tagged tree.
          # --gitleaks-ignore-path points at an empty directory: these files are generated here, and
          # a committed .gitleaksignore has no business suppressing anything in them.
          git rev-list --all | sort -u > "$RUNNER_TEMP/walk-commits.txt"
          git for-each-ref --format='%(objecttype) %(objectname)' | awk '$1 == "tag" { print $2 }' \
            | sort -u > "$RUNNER_TEMP/walk-tags.txt"
          rm -rf "$meta" "$noign"; mkdir -p "$meta" "$noign"
          python3 - "$meta" <<'PY'
          import pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          listing = subprocess.run(
              ["git", "cat-file", "--batch-all-objects", "--batch-check=%(objectname) %(objecttype)"],
              check=True, capture_output=True).stdout.decode().splitlines()
          want = [l.split()[0] for l in listing if l.split()[1:] in (["commit"], ["tag"])]

          def git(*a):
              return subprocess.run(["git", *a], check=True, capture_output=True).stdout

          def dump(oids):
              raw = subprocess.run(["git", "cat-file", "--batch"], input=("\n".join(oids) + "\n").encode(),
                                   check=True, capture_output=True).stdout
              i, n = 0, 0
              while i < len(raw):
                  nl = raw.index(b"\n", i)
                  head = raw[i:nl].decode().split()
                  if len(head) != 3:
                      sys.exit("::error::git cat-file --batch returned %r; refusing to scan a partial dump" % (head,))
                  oid, typ, size = head[0], head[1], int(head[2])
                  (out / ("%s-%s.txt" % (typ, oid))).write_bytes(raw[nl + 1:nl + 1 + size])
                  i, n = nl + 1 + size + 1, n + 1
              return n

          blobs, seen = set(), set()
          starts = git("for-each-ref", "--format=%(objectname)").decode().split()
          starts += [l.split()[0] for l in listing if l.split()[1:] == ["tag"]]
          for oid in starts:
              while oid not in seen:          # follow tag -> tag -> ... to the first object that is not a tag
                  seen.add(oid)
                  typ = git("cat-file", "-t", oid).decode().strip()
                  if typ == "tag":
                      oid = git("cat-file", "tag", oid).decode().split("\n", 1)[0].split()[1]
                  elif typ == "blob":
                      blobs.add(oid)
                  elif typ == "tree":
                      for ent in git("ls-tree", "-r", "-z", oid).split(b"\0"):
                          fields = ent.split(b"\t", 1)[0].split()
                          if fields[1:2] == [b"blob"]:
                              blobs.add(fields[2].decode())
                  # a commit is the walk's business; its message is in the dump already
          n = dump(want)
          m = dump(sorted(blobs)) if blobs else 0
          print("metadata pass: %d commit and tag objects, and %d blob(s) a ref or tag reaches with no "
                "commit in between, written out from the object database" % (n, m))
          PY
          "$RUNNER_TEMP/gitleaks" dir --config "$cfg" --gitleaks-ignore-path "$noign" \
            --ignore-gitleaks-allow --redact=100 --no-banner --exit-code 0 \
            --report-path "$mrep" "$meta" 2>&1 | tail -n 2
          [ -f "$mrep" ] || { echo "::error::the metadata pass wrote no report"; exit 1; }
          cleanup
          for r in "$ref" "$tref" "$bref"; do
            if git rev-parse --verify -q "$r" >/dev/null; then
              echo "::error::$r survived the probe"
              exit 1
            fi
          done
          scanned=$(grep -o '[0-9][0-9]* commits scanned' "$log" | tail -1 || true)
          echo "gitleaks exit $rc; reported ${scanned:-no commit count}"
          # Every finding is accounted for BY VALUE, in both reports, or the job fails. The probe's
          # findings must be exactly where the probe put them. The only other finding accepted is the
          # vendored ruleset matching itself — and only at exactly $GITLEAKS_CONFIG, and only when the
          # bytes at that path in THAT commit hash to the pin or to a listed earlier reviewed version.
          # (Until 2026-10-08 this was a global path allowlist, '(?:^|/)\.github/gitleaks/...', which
          # matched at any depth: a credential in docs/.github/gitleaks/gitleaks-default-8.30.1.toml
          # was excluded from every pass — reproduced, JOB GREEN with the plaintext in the tip. Even
          # anchored, a path rule hides a credential committed at the root path and reverted before
          # the tip, which the pin cannot see: also reproduced, JOB GREEN. A digest cannot be reused.)
          REP="$rep" MREP="$mrep" RID="$rid" PROBE_COMMIT="$commit" PROBE_TAG="$ptag" PROBE_BLOB="$mblob" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          E = os.environ
          path = E["GITLEAKS_CONFIG"]
          reviewed = {E["GITLEAKS_CONFIG_SHA256"]} | set(E.get("GITLEAKS_CONFIG_PRIOR_SHA256", "").split())
          rid, pc, pt, pb = E["RID"], E["PROBE_COMMIT"], E["PROBE_TAG"], E["PROBE_BLOB"]
          tmp = pathlib.Path(E["RUNNER_TEMP"])

          def load(p):
              try:
                  d = json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              except Exception as e:
                  sys.exit("::error::cannot read the gitleaks report %s: %s" % (p, e))
              if not isinstance(d, list):
                  sys.exit("::error::the gitleaks report %s is not a list of findings" % p)
              return d

          def show(f):
              return "%s in %s at commit %s line %s" % (f.get("RuleID"), f.get("File"),
                                                      f.get("Commit") or "-", f.get("StartLine"))

          def blob_digest(commit, p):
              r = subprocess.run(["git", "cat-file", "blob", "%s:%s" % (commit, p)], capture_output=True)
              return hashlib.sha256(r.stdout).hexdigest() if r.returncode == 0 else None

          errors, accepted = [], []
          hist = load(E["REP"])
          marker = [i for i, f in enumerate(hist) if f.get("RuleID") == rid]
          if len(marker) != 1 or hist[marker[0]].get("Commit") != pc or hist[marker[0]].get("File") != ".ci-scope-probe":
              sys.exit("::error::the marker planted on refs/trelyan/scope-probe is not in the history scan's report "
                       "exactly once, in the probe's commit (%d hits, %d findings): this scan does not reach every ref "
                       "of this checkout, or something suppresses the finding" % (len(marker), len(hist)))
          pkey = [i for i, f in enumerate(hist) if f.get("RuleID") == "private-key"
                  and f.get("Commit") == pc and f.get("File") == ".ci-scope-probe-key"]
          if len(pkey) != 1:
              sys.exit("::error::the probe's throwaway private key was not reported by the pinned ruleset's private-key "
                       "rule (%d findings): the pinned config did not load, so this scan is running on the injected "
                       "marker rule alone and would miss every real secret" % len(hist))
          for i, f in enumerate(hist):
              if i in marker or i in pkey:
                  continue
              if f.get("File") == path:
                  d = blob_digest(f.get("Commit", ""), path)
                  if d in reviewed:
                      accepted.append("%s (bytes at that commit: sha256 %s, a reviewed version)" % (show(f), d))
                      continue
              errors.append("history: " + show(f))

          meta = load(E["MREP"])
          want = [("commit-%s.txt" % pc, rid), ("tag-%s.txt" % pt, rid), ("commit-%s.txt" % pc, "private-key"),
                  ("blob-%s.txt" % pb, rid)]
          got = [(pathlib.Path(f.get("File", "")).name, f.get("RuleID")) for f in meta]
          for w in want:
              if got.count(w) != 1:
                  sys.exit("::error::the metadata pass did not report %s in %s exactly once (%d findings): it is not "
                           "reading %s objects with the pinned ruleset, so a clean result from it would mean nothing"
                           % (w[1], w[0], len(meta), w[0].split("-")[0]))
          for f, g in zip(meta, got):
              if g not in want:
                  errors.append("message/metadata of %s: %s at line %s" % (g[0][:-4], f.get("RuleID"), f.get("StartLine")))
          dumped = {p.name[:-4] for p in (tmp / "meta").iterdir()}
          gaps = ["commit-" + c for c in (tmp / "walk-commits.txt").read_text().split() if "commit-" + c not in dumped]
          gaps += ["tag-" + t for t in (tmp / "walk-tags.txt").read_text().split() if "tag-" + t not in dumped]
          if gaps:
              sys.exit("::error::the metadata pass did not dump %d object(s) the walk reaches, e.g. %s"
                       % (len(gaps), ", ".join(gaps[:5])))

          for a in accepted:
              print("accepted (the vendored ruleset matching itself): " + a)
          if errors:
              print("::error::%d finding(s) beyond the probe's. Each is content in this history that the pinned ruleset "
                    "matched — treat each as a secret until shown otherwise:" % len(errors))
              for e in errors:
                  print("    " + e)
              sys.exit(1)
          print("metadata pass: %d objects scanned, the probe's four findings and nothing else" % len(dumped))
          PY
          # A floor, not the equality gate removed in e546f1e. Nothing here is compared to this
          # repository: gitleaks counts a commit only when its diff adds content, which is why
          # comparing its figure with `git rev-list` went red on honest pushes. The probe commit adds
          # two files, so it always counts one, and any non-empty checkout contributes at least one
          # more. This is false only when the walk was narrowed until the probe was all that was left
          # in it — which is what an --author or a --max-count filter written onto the line above
          # would do. It is a floor and nothing more: it does not measure coverage.
          count=${scanned%% *}
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::could not read a commit count from gitleaks' output; refusing to pass"
              exit 1
              ;;
          esac
          if [ "$count" -lt 2 ]; then
            echo "::error::gitleaks walked $count commit(s): the probe was scanned in isolation, so this is not a scan of this repository's history"
            exit 1
          fi
          echo "scan clean over $count commits and every commit and tag message: the probe's findings, plus the vendored ruleset matching itself at reviewed digests, and nothing else. This means no rule in the pinned ruleset matched anything else — not that the history holds no secret."

      # A second pass over the same tree by a different route. The history scan reads git's diffs;
      # this reads the files. It therefore sees content git does not put in a diff at all — an
      # ignored or untracked file sitting in the checkout is the reproduced case: the credential in
      # a gitignored build.local was invisible to the history scan (no leaks found) and found here.
      #
      # It is the TIP only, and it is a weaker gate than the one above: "zero findings" is a
      # condition that a config which loaded nothing would also satisfy. So it does not stand on its
      # own — it first scans a directory this step creates, holding a throwaway key generated here,
      # and refuses to report anything about the workspace unless the pinned ruleset found that.
      - name: Path-mode pass over the checked-out tip (what the history scan's diffs cannot show)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/dir.toml"
          self="$RUNNER_TEMP/dir-selftest"
          rep="$RUNNER_TEMP/dir-report.json"
          srep="$RUNNER_TEMP/dir-selftest-report.json"
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          # Teeth for this step, outside the workspace so nothing here can reach the repository.
          rm -rf "$self"; mkdir -p "$self"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null > "$self/canary.pem"
          [ -s "$self/canary.pem" ] || { echo "::error::could not generate the path-mode canary"; exit 1; }
          "$RUNNER_TEMP/gitleaks" dir --config "$cfg" --ignore-gitleaks-allow --redact=100 \
            --no-banner --exit-code 0 --report-path "$srep" "$self" >/dev/null 2>&1 || true
          rm -rf "$self"
          [ -f "$srep" ] || { echo "::error::the path-mode self-test wrote no report"; exit 1; }
          sp=$(grep -c '^[[:space:]]*"RuleID": "private-key"' "$srep" || true)
          if [ "$sp" -lt 1 ]; then
            echo "::error::the path-mode pass did not find a PEM key it had just written: this invocation is not running the pinned ruleset, so a zero-finding result from it would mean nothing"
            exit 1
          fi
          echo "path-mode self-test: the pinned ruleset's private-key rule fired on a key written one line earlier"
          set +e
          "$RUNNER_TEMP/gitleaks" dir --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --redact=100 --verbose --no-banner --exit-code 0 \
            --report-path "$rep" "$GITHUB_WORKSPACE"
          rc=$?
          set -e
          [ -f "$rep" ] || { echo "::error::the path-mode pass wrote no report (exit $rc)"; exit 1; }
          # The one accepted finding is the vendored ruleset matching itself, at exactly its path and
          # with exactly the pinned bytes (the pin gate above already measured them). A file of the
          # same name anywhere else is scanned like any other file. gitleaks reports absolute paths
          # here, so the path is compared after making it relative to the workspace.
          REP="$rep" python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          E = os.environ
          ws = os.path.abspath(E["GITHUB_WORKSPACE"])
          try:
              rep = json.loads(pathlib.Path(E["REP"]).read_text(encoding="utf-8"))
              assert isinstance(rep, list)
          except Exception as e:
              sys.exit("::error::cannot read the path-mode report: %s" % e)
          bad = []
          for f in rep:
              p = os.path.abspath(f.get("File", ""))
              rel = os.path.relpath(p, ws).replace(os.sep, "/")
              if rel == E["GITLEAKS_CONFIG"] and os.path.isfile(p) and not os.path.islink(p) \
                      and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() == E["GITLEAKS_CONFIG_SHA256"]:
                  print("accepted (the pinned ruleset matching itself): %s at %s line %s"
                        % (f.get("RuleID"), rel, f.get("StartLine")))
                  continue
              bad.append("%s in %s at line %s" % (f.get("RuleID"), rel, f.get("StartLine")))
          if bad:
              print("::error::the path-mode pass reported %d finding(s) in the checked-out tip:" % len(bad))
              for b in bad:
                  print("    " + b)
              sys.exit(1)
          PY
          echo "path-mode pass clean over the tip: no rule in the pinned ruleset matched any file on disk, beyond the pinned ruleset matching itself. This pass does not see history."
