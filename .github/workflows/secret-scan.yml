name: secret-scan

# Every secret this repo could leak is already public if it leaks once, so the scan runs over FULL
# history rather than the pushed range. A credential committed and later "removed" is still in the
# git objects, and range-scoped scanning is exactly how those get missed.
#
# Added 2026-08-13: this repo had no secret scanning on any trigger. Nothing was leaking — the
# history was scanned with gitleaks 8.30.1 before this was written, and every finding traced to a
# false positive. The point of adding it now is that nothing would have caught the first real one.
#
# 2026-09-17: the gitleaks/gitleaks-action@v2.3.7 step that used to be here declared no inputs, so
# the `fail` and `log-opts` values below it were silently discarded ("Unexpected input(s)" in the
# logs). It scanned a commit range, not the history, and it ran gitleaks 8.16.1. It is replaced by
# a pinned, SHA-256-verified gitleaks 8.30.1 that is invoked directly, plus a teeth check that
# fails if the scan can no longer reach a finding on another ref.
#
# 2026-09-18: the teeth check scans a repository it builds itself, so it cannot see the checkout of
# THIS repository. A shallow checkout, or a --log-opts that filters by path, left the teeth check
# green while the real scan walked almost nothing.
#
# 2026-09-18, second pass: the first attempt at that closed it with a count — gitleaks' reported
# "N commits scanned" had to equal `git rev-list --all --no-merges --count`. Those two numbers can
# differ for honest reasons: gitleaks only counts a commit whose diff carries added content, so a
# pure deletion, a mode-only change or an empty merge lowers its figure while the walk is complete.
# Reproduced on a repository holding exactly those three: gitleaks reported 2, the gate expected 4,
# and the job went red on an honest push. The count is no longer compared to the repository.
#
# 2026-09-18, third pass — two holes in the scope probe that replaced the count:
#   1. It planted its canary on refs/heads/ci-scope-probe. A walk narrowed from --all to --branches,
#      or to a refs/heads glob, still reaches refs/heads/*, so that narrowing passed the probe.
#      The canary now goes on refs/trelyan/scope-probe: outside refs/heads/ and refs/tags/, where
#      only a walk over EVERY ref finds it.
#   2. The probe ran its own gitleaks. The command that actually scanned the repository was a
#      separate step, so narrowing that second command's --log-opts left every gate green — the
#      probe proved nothing about the scan that matters. There is now ONE invocation that scans
#      this repository's history: the command that has to find a real secret is the command that
#      has to find the probe.
#
# 2026-09-18, fourth pass — two more, both found by adversarial review of the third:
#   1. NEITHER canary tripped a real gitleaks rule, so no gate exercised a single detector from
#      gitleaks' default ruleset. The probe commit now also carries a throwaway PEM private key,
#      generated inside the job, which is matched by the `private-key` rule of the ruleset itself.
#   2. The walk was a job-level knob (GITLEAKS_LOG_OPTS), and "--all --author=ci" in that variable
#      would have isolated every canary while walking one commit in eighteen. The variable is gone:
#      the log-opts are written into each invocation.
#
# 2026-09-18, FIFTH pass — three holes, every one of them reproduced against the committed step
# bodies of the fourth, with a real AWS key pair sitting in the repository's history and the job
# GREEN. The step bodies were extracted from the committed YAML with PyYAML and run under a
# runner-shaped harness; the numbers quoted below are from those runs.
#
#   1. INHERITED PATH ALLOWLIST, AND BINARY BLINDNESS. The scan ran on gitleaks' DEFAULT config,
#      whose global [allowlist] carries 25 path patterns nobody here reviewed — among them
#      '(?i)\.(?:docx?|xlsx?|pdf|bin|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe|gltf)$'. The identical
#      credential pair gave: docs/architecture.pdf → 2 findings, rc=0 "scan clean"; docs/notes.bin
#      → 2 findings, rc=0; deploy.env → 3 findings, rc=1 CAUGHT. The only variable was the
#      filename. Separately, a file holding a NUL byte (logo.dat) was invisible for a different
#      reason: git renders its diff as "Binary files differ", so gitleaks was handed no content at
#      all — it reported 17 commits where the honest run reported 18, i.e. the offending commit
#      looked empty. And the failure text asserted "Everything else is a secret in this history",
#      a completeness the command did not have.
#      Closed three ways, all three demonstrated: (a) the ruleset is now a VENDORED, SHA-256-pinned
#      copy of upstream's, with 24 of upstream's 25 global path patterns deleted — what is left is
#      '(?:^|/)\.git$' (upstream's, and belt-and-braces: gitleaks' dir walker skips .git anyway --
#      a PEM planted in .git/description is not reported with or without it) and one entry added
#      here for the vendored file itself, which is 3200 lines of
#      detection patterns that match each other (upstream allowlists 'gitleaks\.toml' for the same
#      reason; without it the honest tree reports aws-amazon-bedrock-api-key-short-lived at line 240
#      of that file and the job is red). With the rest gone, the .pdf and .bin credentials are
#      found where they previously were not; (b) the walk
#      passes --text, so git renders binary diffs as text and the NUL-byte case is found (16 → 17
#      commits, 0 → 1 finding); (c) a second, path-mode pass over the checked-out tip, which does
#      not go through git's diff machinery at all.
#
#   2. INLINE gitleaks:allow. gitleaks honours a trailing `gitleaks:allow` comment by default. The
#      credential pair in deploy.cfg AT THE TIP with that comment: 2 findings, rc=0, GREEN. No
#      config file, no workflow edit, no fingerprint file — one comment in the same commit as the
#      secret. Closed by --ignore-gitleaks-allow on every invocation.
#
#   3. THE RULESET GATE WAS SATISFIED BY THE THING IT TESTED. The "default ruleset is in effect"
#      gate greps the report for the literal RuleID "private-key" — but the run-time config was
#      `[extend] path = <repo>/.gitleaks.toml`, so the REPOSITORY decided which rules existed. A
#      value compared with itself. Three configs each passed that gate with a live key in history:
#      a repo rule merely declaring `id = "private-key"` and nothing else (defaults never loaded,
#      rc=0); `useDefault = true` + `disabledRules = [...]` (rc=0); `useDefault = true` +
#      `[[allowlists]] paths = ['''deploy\.env''']` (rc=0). The honest control — the same tree with
#      `[extend] useDefault = true` and nothing else — was rc=1.
#      Closed by taking the ruleset out of the repository's hands at assembly: the scan config is
#      built HERE as `[extend] path = <the pinned vendored file>`, and .gitleaks.toml can only ADD
#      rules, which are re-emitted field by field from a parsed copy. A .gitleaks.toml that does
#      not set useDefault = true, sets disabledRules, extends somewhere else, collides with a
#      ruleset id, uses a rule field this gate cannot re-emit, or declares an allowlist that is not
#      in .github/gitleaks/allowlist-exceptions.txt, fails the job. It is printed either way.
#      Note what an approved allowlist does and does not do: repository allowlists are never
#      carried into the assembled config at all, so listing one in the exceptions file lets it
#      EXIST (for gitleaks run locally) and nothing more. Verified while writing this — with the
#      `paths = ['''deploy\.env''']` allowlist approved by digest, the config gate passed and the
#      scan still found the planted credential and failed the job.
#
# WHAT THESE CHECKS STILL CANNOT DO — read this before quoting the job as evidence:
#   * The scan is gitleaks' regex ruleset. A credential no rule matches is not found, by any pass,
#     ever. "scan clean" means "no rule in the pinned ruleset matched", and nothing more.
#   * The SHA-256 pin proves the vendored file has not changed since it was reviewed. It does NOT
#     prove the file is faithful to upstream — only reading the diff does. The upstream URL and
#     upstream sha256 are recorded in the file's header so a reviewer can redo that comparison.
#   * The path-mode pass sees the checked-out TIP only. A credential that was committed into a file
#     git still cannot render, and deleted before the tip, is reachable by neither pass.
#   * --text makes git render binary diffs as text. It does not defeat compression or encoding: a
#     credential inside a .zip, a .png's pixel data, or any encoded blob is not plaintext in the
#     diff and will not match. Archive traversal is off (--max-archive-depth defaults to 0).
#   * The two surviving global allowlist paths are holes by construction: a credential written into
#     .git/ or into the vendored ruleset file is not reported. Both are pinned or not source, and
#     both are named in the file, which is the most that can be said for them.
#   * .gitleaksignore still suppresses by fingerprint, by design. It is a committed file, so each
#     entry is a reviewed line — but it IS repository-controlled subtraction, and the config gate
#     prints its contents rather than policing them.
#   * The repository-config gate parses TOML with Python's tomllib; gitleaks parses it in Go. The
#     scan runs on this gate's RE-EMISSION, not on the repository's file, so a disagreement between
#     the two parsers changes what is scanned rather than slipping past the check — but it is a
#     disagreement, and a rule this gate cannot re-emit is rejected rather than guessed at.
#   * None of this is externally audited. Every statement here is self-attested and reproduced only
#     by the runs described above.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. gitleaks' ruleset changes without this repo changing, so a scan that only fires on
    # push cannot notice a newly-detectable pattern in code that has been sitting there for months.
    # The ruleset is now pinned, so this trigger no longer picks up upstream rule changes on its
    # own — bumping GITLEAKS_VERSION and re-vendoring the config is a reviewed commit.
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # The ruleset the scan runs on: vendored from upstream v8.30.1, path allowlist trimmed,
      # pinned here so changing it is a reviewed edit and not an input.
      GITLEAKS_CONFIG: ".github/gitleaks/gitleaks-default-8.30.1.toml"
      GITLEAKS_CONFIG_SHA256: "f047c1a7e816c93d21d753b1c6f7d0e30e996a77c6f161d78a3d0aea79f1a659"
      GITLEAKS_ALLOWLIST_EXCEPTIONS: ".github/gitleaks/allowlist-exceptions.txt"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Required for --log-opts=--all to reach anything but the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The ruleset is an artifact of this repository, not a default inherited at run time. This
      # gate is the whole reason the "is the default ruleset in effect" question is answerable
      # without asking the thing under test: the bytes are fixed here, in the workflow.
      - name: Pinned ruleset gate (the scan's config is this repo's, byte for byte)
        run: |
          set -euo pipefail
          cfg="$GITHUB_WORKSPACE/$GITLEAKS_CONFIG"
          [ -f "$cfg" ] || { echo "::error::$GITLEAKS_CONFIG is missing; the scan has no reviewed ruleset"; exit 1; }
          got=$(sha256sum "$cfg" | cut -d' ' -f1)
          echo "pinned   $GITLEAKS_CONFIG_SHA256"
          echo "measured $got"
          if [ "$got" != "$GITLEAKS_CONFIG_SHA256" ]; then
            echo "::error::$GITLEAKS_CONFIG does not match the SHA-256 pinned in this workflow. If the change is intended, update GITLEAKS_CONFIG_SHA256 in the same commit — that is what makes the ruleset a reviewed edit."
            exit 1
          fi
          echo "$(grep -c '^\[\[rules\]\]' "$cfg") rules; global allowlist paths kept:"
          sed -n '/^paths = \[/,/^\]/p' "$cfg"

      # A repository may ADD detection. It may not subtract it. Everything below is a way of
      # subtracting, and each one was green with a live AWS key in history before this existed.
      # The file is printed either way, so the log shows what was in effect and not just a verdict.
      - name: Repository configuration gate (.gitleaks.toml may only add rules)
        run: |
          set -euo pipefail
          BASE_CONFIG="$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, tomllib

          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          base = pathlib.Path(os.environ["BASE_CONFIG"])
          exc_name = os.environ["GITLEAKS_ALLOWLIST_EXCEPTIONS"]
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "repo-rules.toml"
          out.write_text("", encoding="utf-8")   # nothing appended unless a rule survives below

          ign = ws / ".gitleaksignore"
          if ign.is_file():
              entries = [l for l in ign.read_text(encoding="utf-8").splitlines()
                         if l.strip() and not l.lstrip().startswith("#")]
              print(".gitleaksignore: present, %d fingerprint(s) — each one suppresses a real "
                    "finding and is NOT policed by this gate:" % len(entries))
              for l in entries:
                  print("    " + l)
          else:
              print(".gitleaksignore: absent")

          repo = ws / ".gitleaks.toml"
          if not repo.is_file():
              print(".gitleaks.toml: absent — the scan runs on the pinned ruleset alone")
              sys.exit(0)

          text = repo.read_text(encoding="utf-8")
          print("---- .gitleaks.toml (%d bytes, sha256 %s) ----"
                % (len(text.encode()), hashlib.sha256(text.encode()).hexdigest()))
          print(text)
          print("---- end .gitleaks.toml ----")

          try:
              doc = tomllib.loads(text)
          except Exception as e:
              print("::error::.gitleaks.toml is not parseable TOML: %s" % e)
              sys.exit(1)

          bad = []
          ext = doc.get("extend", {})
          if ext.get("useDefault") is not True:
              bad.append("[extend] useDefault is %r, not true: this config does not turn the "
                         "ruleset on, so the scan would run on whatever it happens to define"
                         % (ext.get("useDefault"),))
          for k in ("path", "url"):
              if k in ext:
                  bad.append("[extend] %s = %r: the ruleset is pinned in the workflow and may not "
                             "be redirected from here" % (k, ext[k]))
          for where, d in (("[extend]", ext.get("disabledRules")),
                           ("top level", doc.get("disabledRules"))):
              if d:
                  bad.append("disabledRules at %s is set to %r: that is subtraction" % (where, d))

          base_doc = tomllib.loads(base.read_text(encoding="utf-8"))
          base_ids = {r["id"] for r in base_doc.get("rules", []) if "id" in r}
          print("pinned ruleset: %d rules" % len(base_ids))

          def allowlists(d):
              found = []
              if "allowlist" in d:
                  found.append(("global [allowlist]", d["allowlist"]))
              for i, a in enumerate(d.get("allowlists", []) or []):
                  found.append(("global [[allowlists]] #%d" % i, a))
              for r in d.get("rules", []) or []:
                  rid = r.get("id", "?")
                  if "allowlist" in r:
                      found.append(("rule %s [rules.allowlist]" % rid, r["allowlist"]))
                  for i, a in enumerate(r.get("allowlists", []) or []):
                      found.append(("rule %s [[rules.allowlists]] #%d" % (rid, i), a))
              return found

          approved = set()
          exc = ws / exc_name
          if exc.is_file():
              for line in exc.read_text(encoding="utf-8").splitlines():
                  line = line.split("#", 1)[0].strip().lower()
                  if line:
                      approved.add(line)
          print("reviewed allowlist exceptions in %s: %d" % (exc_name, len(approved)))
          for label, a in allowlists(doc):
              digest = hashlib.sha256(json.dumps(a, sort_keys=True,
                                                 separators=(",", ":")).encode()).hexdigest()
              if digest in approved:
                  print("allowlist %s: approved (%s) — note that the scan does not apply it; "
                        "repository allowlists are never carried into the assembled config"
                        % (label, digest))
              else:
                  bad.append("allowlist %s is not a reviewed exception. Its digest is %s — if "
                             "this allowlist should be allowed to exist (it will not be applied to "
                             "the scan either way), add that line to %s in this review."
                             % (label, digest, exc_name))

          # Re-emission, field by field, from the parsed document. The scan runs on THIS, not on
          # the repository's file: a field this gate does not know how to carry across is rejected
          # rather than passed through, so "unknown" can never mean "allowed".
          SIMPLE = {"id": "str", "description": "str", "regex": "lit", "path": "lit",
                    "entropy": "num", "secretGroup": "int", "keywords": "list", "tags": "list"}
          seen, chunks = set(), []
          for r in doc.get("rules", []) or []:
              rid = r.get("id")
              if not isinstance(rid, str) or not rid:
                  bad.append("a [[rules]] entry has no string id"); continue
              if rid in base_ids:
                  bad.append("rule id %r collides with a rule in the pinned ruleset: a repository "
                             "rule with that id REPLACES it, which is subtraction wearing an "
                             "addition's clothes" % rid)
                  continue
              if rid in seen:
                  bad.append("rule id %r is declared twice" % rid); continue
              seen.add(rid)
              unknown = [k for k in r if k not in SIMPLE]
              if unknown:
                  bad.append("rule %r uses field(s) %s that this gate cannot re-emit; add "
                             "support for them in the workflow in a reviewed commit rather than "
                             "letting them through unchecked. A rule-attached allowlist lands here "
                             "whatever the exceptions file says: it is subtraction, and this gate "
                             "refuses rather than guesses" % (rid, ", ".join(sorted(unknown))))
                  continue
              lines = ["[[rules]]"]
              for k, kind in SIMPLE.items():
                  if k not in r:
                      continue
                  v = r[k]
                  if kind == "lit":
                      if not isinstance(v, str) or "'''" in v:
                          bad.append("rule %r field %s is not a re-emittable string" % (rid, k))
                          break
                      lines.append("%s = '''%s'''" % (k, v))
                  elif kind == "str":
                      lines.append("%s = %s" % (k, json.dumps(str(v))))
                  elif kind in ("num", "int"):
                      lines.append("%s = %s" % (k, v))
                  else:
                      if not isinstance(v, list) or not all(isinstance(x, str) for x in v):
                          bad.append("rule %r field %s is not a list of strings" % (rid, k))
                          break
                      lines.append("%s = [%s]" % (k, ", ".join(json.dumps(x) for x in v)))
              else:
                  chunks.append("\n".join(lines))

          if bad:
              for b in bad:
                  print("::error::.gitleaks.toml: " + b)
              sys.exit(1)
          out.write_text("\n" + "\n\n".join(chunks) + "\n" if chunks else "", encoding="utf-8")
          print("accepted: %d added rule(s) re-emitted into %s" % (len(chunks), out))
          print(out.read_text(encoding="utf-8"))
          PY

      # The teeth check proves a finding reachable only from another ref is found, on a repository
      # it builds itself. It says nothing about the checkout of THIS repository: that is what the
      # full-clone gate and the scan below are for. Its canary matches a rule this step writes, so
      # it says nothing about the pinned ruleset either: the pin and the scan's private-key canary
      # are what carry that. It uses the same assembled config as the scan so that anything the
      # repository adds is exercised here too.
      - name: Teeth check (a planted finding reachable only from another ref must be found)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/teeth"; cfg="$RUNNER_TEMP/teeth.toml"
          rm -rf "$d"; mkdir -p "$d"
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          cat >> "$cfg" <<'EOF'

          [[rules]]
          id = "teeth-canary"
          regex = '''TEETH_CANARY_[0-9]{8}'''
          EOF
          g() { git -C "$d" -c user.name=ci -c user.email=ci@invalid "$@"; }
          g init -q -b main
          echo "planted TEETH_CANARY_12345678" > "$d/planted.txt"
          g add planted.txt && g commit -qm planted
          g checkout -q --orphan clean
          g rm -q --cached planted.txt && rm "$d/planted.txt"
          echo ok > "$d/ok.txt" && g add ok.txt && g commit -qm clean
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --log-opts="--all --text" --exit-code 3 --no-banner "$d"
          rc=$?
          set -e
          [ "$rc" -eq 3 ] || { echo "::error::teeth check expected exit 3, got $rc"; exit 1; }

      # A gate, not a print. actions/checkout defaults to a depth-1 clone, so dropping the fetch-depth: 0
      # above would leave one commit to scan and every other step still green.
      - name: Full-clone gate
        run: |
          set -euo pipefail
          [ "$(git rev-parse --is-shallow-repository)" = false ] || {
            echo "::error::shallow checkout: the scan cannot see history"
            exit 1
          }
          echo "$(git rev-list --all --count) commits reachable from all refs"

      # THE history scan of this repository, and the probe that proves its scope AND that the pinned
      # ruleset actually loaded, in ONE gitleaks invocation. That is the point: the command that has
      # to find a real secret is the command that has to find the probe, so there is no second
      # command whose walk can be narrowed behind the gate's back, and the log-opts are written here
      # rather than read from a variable, so narrowing them is the same visible edit as deleting an
      # assertion.
      #
      # The probe is one commit on refs/trelyan/scope-probe — outside refs/heads/ and refs/tags/, in
      # files the tip does not contain, dated at the epoch, built with git plumbing so the working tree
      # is never touched and deleted again in a trap. It carries two things:
      #
      #   .ci-scope-probe      a marker matched by a rule this step adds to the run-time config. Only a
      #                        walk over every ref reaches it: --branches, a refs/heads glob, --remotes,
      #                        --tags, -1, a --since or a path filter all miss it.
      #   .ci-scope-probe-key  a throwaway PEM private key generated here, by this job, matched by the
      #                        `private-key` rule of the PINNED ruleset. Nothing in this workflow
      #                        defines that rule, so the finding exists only if the pinned file was
      #                        actually loaded — which is now a statement about a file whose bytes this
      #                        workflow fixes, not about a file the repository supplies.
      #
      # The key is generated on a pipe into git hash-object: it is never written to the working tree,
      # never committed to any branch, never in the tip's tree, and never pushed — this job holds only
      # `contents: read`, checks out with persist-credentials: false, and pushes nothing. Deleting the
      # ref leaves its objects unreachable on an ephemeral runner.
      #
      # --text is on the walk deliberately: without it git renders a diff touching a file with a NUL
      # byte as "Binary files differ" and gitleaks is handed no content — reproduced, a planted key in
      # such a file was invisible and the commit did not even count.
      - name: gitleaks over every ref (must find the probe's marker AND trip a pinned-ruleset rule, and nothing else)
        run: |
          set -euo pipefail
          ref="refs/trelyan/scope-probe"
          cfg="$RUNNER_TEMP/scan.toml"
          rep="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          # Installed for the whole step and never removed: the ref goes away whether the assertions
          # below pass, fail, or never run.
          cleanup() { git update-ref -d "$ref" 2>/dev/null || true; }
          trap cleanup EXIT
          if git rev-parse --verify -q "$ref" >/dev/null; then
            echo "::error::$ref already exists; the probe would not be distinguishable"
            exit 1
          fi
          # Assembled at run time, and deliberately split: the scannable form must never exist in this
          # repository. If it did, the probe would match this workflow file in the tip's own tree and pass
          # without the scan ever reaching another ref.
          rid='scope''-probe-canary'
          pre='SCOPE_PROBE''_CANARY_'
          mark="${pre}20260918"
          # Workflow-owned. The repository's .gitleaks.toml is NOT extended here: whatever it adds
          # arrives as the rules the config gate re-emitted, and it cannot reach the [extend] line.
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          printf '\n[[rules]]\nid = "%s"\nregex = "%s[0-9]{8}"\n' "$rid" "$pre" >> "$cfg"
          # Plumbing only: nothing is added to the working tree, and the ref is deleted again below.
          # The key exists on a pipe and inside the object database, and nowhere else.
          mblob=$(printf 'probe %s\n' "$mark" | git hash-object -w --stdin)
          kblob=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | git hash-object -w --stdin) || kblob=""
          if [ -z "$kblob" ]; then
            echo "::error::could not generate the probe's throwaway private key; refusing to pass without a ruleset canary"
            exit 1
          fi
          # An identity of its own. The teeth commits are `ci <ci@invalid>`; if the probe shared that,
          # one author filter would isolate every canary in this workflow at once.
          tree=$(printf '100644 blob %s\t.ci-scope-probe\n100644 blob %s\t.ci-scope-probe-key\n' \
            "$mblob" "$kblob" | git mktree)
          commit=$(GIT_AUTHOR_DATE='@0 +0000' GIT_COMMITTER_DATE='@0 +0000' \
            git -c user.name=trelyan-scope-probe -c user.email=scope-probe@invalid \
            commit-tree "$tree" -m "ci scope probe")
          git update-ref "$ref" "$commit"
          # One invocation, the workflow's own config, --all --text written here, a JSON report.
          # --ignore-gitleaks-allow: without it a trailing `gitleaks:allow` comment on the line
          # carrying a credential suppresses the finding and this job goes green — reproduced.
          # --exit-code 0 on purpose: the probe guarantees findings, so gitleaks' own exit status
          # cannot be the gate. The report is. A gitleaks that cannot run writes no report, or an
          # empty one, and the assertions below fail on that too.
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --log-opts="--all --text" --redact=100 --verbose --no-banner \
            --exit-code 0 --report-path "$rep" . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          cleanup
          if git rev-parse --verify -q "$ref" >/dev/null; then
            echo "::error::$ref survived the probe"
            exit 1
          fi
          scanned=$(grep -o '[0-9][0-9]* commits scanned' "$log" | tail -1 || true)
          echo "gitleaks exit $rc; reported ${scanned:-no commit count}"
          [ -f "$rep" ] || { echo "::error::gitleaks wrote no report (exit $rc)"; exit 1; }
          total=$(grep -c '^[[:space:]]*"RuleID": ' "$rep" || true)
          probe=$(grep -c "^[[:space:]]*\"RuleID\": \"$rid\"" "$rep" || true)
          pkey=$(grep -c '^[[:space:]]*"RuleID": "private-key"' "$rep" || true)
          if [ "$probe" -ne 1 ]; then
            echo "::error::the marker planted on $ref is not in the scan's report (gitleaks exit $rc, $total findings): this scan does not reach every ref of this checkout, or something suppresses the finding"
            exit 1
          fi
          # -lt, not -ne: a second private-key finding is a real key in this history, and the
          # total check below reports it as such instead of blaming the ruleset. With the marker at
          # exactly one and the total at exactly two, a passing run has exactly one private-key
          # finding, so the pass condition is unchanged either way.
          if [ "$pkey" -lt 1 ]; then
            echo "::error::the probe's throwaway private key was not reported by the pinned ruleset's private-key rule (gitleaks exit $rc, $total findings): the pinned config did not load, so this scan is running on the injected marker rule alone and would miss every real secret"
            exit 1
          fi
          if [ "$total" -ne 2 ]; then
            echo "::error::the scan reported $total findings; exactly two (the probe's marker and its private key) were expected. Everything else is content in this history that the pinned ruleset matched — treat each as a secret until shown otherwise:"
            grep -E '^[[:space:]]*"(RuleID|File|Commit|StartLine|Fingerprint)": ' "$rep" >&2 || true
            exit 1
          fi
          # A floor, not the equality gate removed in e546f1e. Nothing here is compared to this
          # repository: gitleaks counts a commit only when its diff adds content, which is why
          # comparing its figure with `git rev-list` went red on honest pushes. The probe commit adds
          # two files, so it always counts one, and any non-empty checkout contributes at least one
          # more. This is false only when the walk was narrowed until the probe was all that was left
          # in it — which is what an --author or a --max-count filter written onto the line above
          # would do. It is a floor and nothing more: it does not measure coverage.
          count=${scanned%% *}
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::could not read a commit count from gitleaks' output; refusing to pass"
              exit 1
              ;;
          esac
          if [ "$count" -lt 2 ]; then
            echo "::error::gitleaks walked $count commit(s): the probe was scanned in isolation, so this is not a scan of this repository's history"
            exit 1
          fi
          echo "scan clean: two findings, the probe's marker on a ref the tip cannot reach and a pinned-ruleset hit on the probe's key, over $count commits. This means no rule in the pinned ruleset matched anything else — not that the history holds no secret."

      # A second pass over the same tree by a different route. The history scan reads git's diffs;
      # this reads the files. It therefore sees content git does not put in a diff at all — an
      # ignored or untracked file sitting in the checkout is the reproduced case: the credential in
      # a gitignored build.local was invisible to the history scan (no leaks found) and found here.
      #
      # It is the TIP only, and it is a weaker gate than the one above: "zero findings" is a
      # condition that a config which loaded nothing would also satisfy. So it does not stand on its
      # own — it first scans a directory this step creates, holding a throwaway key generated here,
      # and refuses to report anything about the workspace unless the pinned ruleset found that.
      - name: Path-mode pass over the checked-out tip (what the history scan's diffs cannot show)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/dir.toml"
          self="$RUNNER_TEMP/dir-selftest"
          rep="$RUNNER_TEMP/dir-report.json"
          srep="$RUNNER_TEMP/dir-selftest-report.json"
          printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/$GITLEAKS_CONFIG" > "$cfg"
          cat "$RUNNER_TEMP/repo-rules.toml" >> "$cfg"
          # Teeth for this step, outside the workspace so nothing here can reach the repository.
          rm -rf "$self"; mkdir -p "$self"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null > "$self/canary.pem"
          [ -s "$self/canary.pem" ] || { echo "::error::could not generate the path-mode canary"; exit 1; }
          "$RUNNER_TEMP/gitleaks" dir --config "$cfg" --ignore-gitleaks-allow --redact=100 \
            --no-banner --exit-code 0 --report-path "$srep" "$self" >/dev/null 2>&1 || true
          rm -rf "$self"
          [ -f "$srep" ] || { echo "::error::the path-mode self-test wrote no report"; exit 1; }
          sp=$(grep -c '^[[:space:]]*"RuleID": "private-key"' "$srep" || true)
          if [ "$sp" -lt 1 ]; then
            echo "::error::the path-mode pass did not find a PEM key it had just written: this invocation is not running the pinned ruleset, so a zero-finding result from it would mean nothing"
            exit 1
          fi
          echo "path-mode self-test: the pinned ruleset's private-key rule fired on a key written one line earlier"
          set +e
          "$RUNNER_TEMP/gitleaks" dir --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --ignore-gitleaks-allow --redact=100 --verbose --no-banner --exit-code 0 \
            --report-path "$rep" "$GITHUB_WORKSPACE"
          rc=$?
          set -e
          [ -f "$rep" ] || { echo "::error::the path-mode pass wrote no report (exit $rc)"; exit 1; }
          total=$(grep -c '^[[:space:]]*"RuleID": ' "$rep" || true)
          if [ "$total" -ne 0 ]; then
            echo "::error::the path-mode pass reported $total finding(s) in the checked-out tip:"
            grep -E '^[[:space:]]*"(RuleID|File|StartLine)": ' "$rep" >&2 || true
            exit 1
          fi
          echo "path-mode pass clean over the tip: no rule in the pinned ruleset matched any file on disk. This pass does not see history."
