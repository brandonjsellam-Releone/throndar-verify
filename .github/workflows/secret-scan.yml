name: secret-scan

# Every secret this repo could leak is already public if it leaks once, so the scan runs over FULL
# history rather than the pushed range. A credential committed and later "removed" is still in the
# git objects, and range-scoped scanning is exactly how those get missed.
#
# Added 2026-08-13: this repo had no secret scanning on any trigger. Nothing was leaking — the
# history was scanned with gitleaks 8.30.1 before this was written, and every finding traced to a
# false positive. The point of adding it now is that nothing would have caught the first real one.
#
# 2026-09-17: the gitleaks/gitleaks-action@v2.3.7 step that used to be here declared no inputs, so
# the `fail` and `log-opts` values below it were silently discarded ("Unexpected input(s)" in the
# logs). It scanned a commit range, not the history, and it ran gitleaks 8.16.1. It is replaced by
# a pinned, SHA-256-verified gitleaks 8.30.1 that is invoked directly, plus a teeth check that
# fails if the scan can no longer reach a finding on another ref.
#
# 2026-09-18: the teeth check scans a repository it builds itself, so it cannot see the checkout of
# THIS repository. A shallow checkout, or a --log-opts that filters by path, left the teeth check
# green while the real scan walked almost nothing.
#
# 2026-09-18, second pass: the first attempt at that closed it with a count — gitleaks' reported
# "N commits scanned" had to equal `git rev-list --all --no-merges --count`. Those two numbers can
# differ for honest reasons: gitleaks only counts a commit whose diff carries added content, so a
# pure deletion, a mode-only change or an empty merge lowers its figure while the walk is complete.
# Reproduced on a repository holding exactly those three: gitleaks reported 2, the gate expected 4,
# and the job went red on an honest push. The count is no longer compared to the repository.
#
# 2026-09-18, third pass — two holes in the scope probe that replaced the count:
#   1. It planted its canary on refs/heads/ci-scope-probe. A walk narrowed from --all to --branches,
#      or to a refs/heads glob, still reaches refs/heads/*, so that narrowing passed the probe.
#      The canary now goes on refs/trelyan/scope-probe: outside refs/heads/ and refs/tags/, where
#      only a walk over EVERY ref finds it.
#   2. The probe ran its own gitleaks. The command that actually scanned the repository was a
#      separate step, so narrowing that second command's --log-opts left every gate green — the
#      probe proved nothing about the scan that matters. There is now ONE invocation that scans
#      this repository: the command that has to find a real secret is the command that has to find
#      the probe.
#
# 2026-09-18, fourth pass — two more, both found by adversarial review of the third:
#   1. NEITHER canary tripped a real gitleaks rule. The teeth canary matches a rule the teeth step
#      writes into its own config; the probe canary matched a rule the scan step writes into its
#      own run-time config. So no gate exercised a single detector from gitleaks' default ruleset,
#      and a .gitleaks.toml in this repository that did not turn the default ruleset on would have
#      reduced the whole secret scan to the probe rule with every gate still green. The probe
#      commit now also carries a throwaway PEM private key, generated inside the job, which is
#      matched by gitleaks' OWN `private-key` rule. The report must hold exactly two findings: the
#      injected marker rule, and `private-key`. A missing `private-key` finding means the default
#      ruleset is not in effect, and the job fails.
#   2. The walk was a job-level knob (GITLEAKS_LOG_OPTS). The probe commit and the teeth commits
#      shared the identity `ci <ci@invalid>`, so "--all --author=ci" in that variable would have
#      isolated the canaries and satisfied both gates while walking one commit in eighteen, under a
#      step named "gitleaks over every ref". The variable is gone: --log-opts=--all is written into
#      each invocation, so narrowing the walk is the same visible edit as deleting an assertion.
#      The probe commit is also given an identity of its own, so it no longer coincides with the
#      teeth canary's, and the scan additionally refuses to pass if gitleaks walked the probe
#      commit alone.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. gitleaks' ruleset changes without this repo changing, so a scan that only fires on
    # push cannot notice a newly-detectable pattern in code that has been sitting there for months.
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Required for --log-opts=--all to reach anything but the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The teeth check uses the SAME repo config as the real scan, so a catch-all allowlist turns this
      # step red. It scans a repository it builds itself, so it says nothing about the checkout of this
      # one: that is what the full-clone gate and the scan below are for. Its canary matches a rule this
      # step writes itself, so it says nothing about gitleaks' default ruleset either: that is what the
      # private-key half of the scan's probe is for.
      - name: Teeth check (a planted finding reachable only from another ref must be found)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/teeth"; cfg="$RUNNER_TEMP/teeth.toml"
          rm -rf "$d"; mkdir -p "$d"
          if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ]; then
            printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/.gitleaks.toml" > "$cfg"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg"
          fi
          cat >> "$cfg" <<'EOF'

          [[rules]]
          id = "teeth-canary"
          regex = '''TEETH_CANARY_[0-9]{8}'''
          EOF
          g() { git -C "$d" -c user.name=ci -c user.email=ci@invalid "$@"; }
          g init -q -b main
          echo "planted TEETH_CANARY_12345678" > "$d/planted.txt"
          g add planted.txt && g commit -qm planted
          g checkout -q --orphan clean
          g rm -q --cached planted.txt && rm "$d/planted.txt"
          echo ok > "$d/ok.txt" && g add ok.txt && g commit -qm clean
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --log-opts=--all --exit-code 3 --no-banner "$d"
          rc=$?
          set -e
          [ "$rc" -eq 3 ] || { echo "::error::teeth check expected exit 3, got $rc"; exit 1; }

      # A gate, not a print. actions/checkout defaults to a depth-1 clone, so dropping the fetch-depth: 0
      # above would leave one commit to scan and every other step still green.
      - name: Full-clone gate
        run: |
          set -euo pipefail
          [ "$(git rev-parse --is-shallow-repository)" = false ] || {
            echo "::error::shallow checkout: the scan cannot see history"
            exit 1
          }
          echo "$(git rev-list --all --count) commits reachable from all refs"

      # THE scan of this repository, and the probe that proves its scope AND its ruleset, in ONE
      # gitleaks invocation. That is the point: the command that has to find a real secret is the
      # command that has to find the probe, so there is no second command whose walk can be narrowed
      # behind the gate's back, and --log-opts=--all is written here rather than read from a variable,
      # so narrowing it is the same visible edit as deleting an assertion.
      #
      # The probe is one commit on refs/trelyan/scope-probe — outside refs/heads/ and refs/tags/, in
      # files the tip does not contain, dated at the epoch, built with git plumbing so the working tree
      # is never touched and deleted again in a trap. It carries two things:
      #
      #   .ci-scope-probe      a marker matched by a rule this step adds to the run-time config. Only a
      #                        walk over every ref reaches it: --branches, a refs/heads glob, --remotes,
      #                        --tags, -1, a --since or a path filter all miss it, and so does anything
      #                        that blinds detection (a catch-all allowlist in this repo's
      #                        .gitleaks.toml, a .gitleaksignore fingerprint).
      #   .ci-scope-probe-key  a throwaway PEM private key generated here, by this job, matched by
      #                        gitleaks' OWN default `private-key` rule. Nothing in this workflow
      #                        defines that rule, so the finding exists only if the default ruleset is
      #                        actually loaded. That is the half the marker cannot prove.
      #
      # The key is generated on a pipe into git hash-object: it is never written to the working tree,
      # never committed to any branch, never in the tip's tree, and never pushed — this job holds only
      # `contents: read`, checks out with persist-credentials: false, and pushes nothing. Deleting the
      # ref leaves its objects unreachable on an ephemeral runner.
      #
      # Then the report must hold exactly two findings, the marker and private-key. A missing marker is
      # a scan that no longer reaches every ref of this checkout; a missing private-key is a scan whose
      # default ruleset is off; a third finding is a real secret in this history.
      - name: gitleaks over every ref (must find the probe's marker AND trip a real default rule, and nothing else)
        run: |
          set -euo pipefail
          ref="refs/trelyan/scope-probe"
          cfg="$RUNNER_TEMP/scan.toml"
          rep="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          # Installed for the whole step and never removed: the ref goes away whether the assertions
          # below pass, fail, or never run.
          cleanup() { git update-ref -d "$ref" 2>/dev/null || true; }
          trap cleanup EXIT
          if git rev-parse --verify -q "$ref" >/dev/null; then
            echo "::error::$ref already exists; the probe would not be distinguishable"
            exit 1
          fi
          # Assembled at run time, and deliberately split: the scannable form must never exist in this
          # repository. If it did, the probe would match this workflow file in the tip's own tree and pass
          # without the scan ever reaching another ref.
          rid='scope''-probe-canary'
          pre='SCOPE_PROBE''_CANARY_'
          mark="${pre}20260918"
          if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ]; then
            printf '[extend]\npath = "%s"\n' "$GITHUB_WORKSPACE/.gitleaks.toml" > "$cfg"
          else
            printf '[extend]\nuseDefault = true\n' > "$cfg"
          fi
          printf '\n[[rules]]\nid = "%s"\nregex = "%s[0-9]{8}"\n' "$rid" "$pre" >> "$cfg"
          # Plumbing only: nothing is added to the working tree, and the ref is deleted again below.
          # The key exists on a pipe and inside the object database, and nowhere else.
          mblob=$(printf 'probe %s\n' "$mark" | git hash-object -w --stdin)
          kblob=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | git hash-object -w --stdin) || kblob=""
          if [ -z "$kblob" ]; then
            echo "::error::could not generate the probe's throwaway private key; refusing to pass without a default-rule canary"
            exit 1
          fi
          # An identity of its own. The teeth commits are `ci <ci@invalid>`; if the probe shared that,
          # one author filter would isolate every canary in this workflow at once.
          tree=$(printf '100644 blob %s\t.ci-scope-probe\n100644 blob %s\t.ci-scope-probe-key\n' \
            "$mblob" "$kblob" | git mktree)
          commit=$(GIT_AUTHOR_DATE='@0 +0000' GIT_COMMITTER_DATE='@0 +0000' \
            git -c user.name=trelyan-scope-probe -c user.email=scope-probe@invalid \
            commit-tree "$tree" -m "ci scope probe")
          git update-ref "$ref" "$commit"
          # One invocation, this repository's own config, --all written here, a JSON report.
          # --exit-code 0 on purpose: the probe guarantees findings, so gitleaks' own exit status
          # cannot be the gate. The report is. A gitleaks that cannot run writes no report, or an
          # empty one, and the assertions below fail on that too.
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$cfg" --gitleaks-ignore-path "$GITHUB_WORKSPACE" \
            --log-opts=--all --redact=100 --verbose --no-banner --exit-code 0 \
            --report-path "$rep" . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          cleanup
          if git rev-parse --verify -q "$ref" >/dev/null; then
            echo "::error::$ref survived the probe"
            exit 1
          fi
          scanned=$(grep -o '[0-9][0-9]* commits scanned' "$log" | tail -1 || true)
          echo "gitleaks exit $rc; reported ${scanned:-no commit count}"
          [ -f "$rep" ] || { echo "::error::gitleaks wrote no report (exit $rc)"; exit 1; }
          total=$(grep -c '^[[:space:]]*"RuleID": ' "$rep" || true)
          probe=$(grep -c "^[[:space:]]*\"RuleID\": \"$rid\"" "$rep" || true)
          pkey=$(grep -c '^[[:space:]]*"RuleID": "private-key"' "$rep" || true)
          if [ "$probe" -ne 1 ]; then
            echo "::error::the marker planted on $ref is not in the scan's report (gitleaks exit $rc, $total findings): this scan does not reach every ref of this checkout, or something suppresses the finding"
            exit 1
          fi
          # -lt, not -ne: a second private-key finding is a real key in this history, and the
          # total check below reports it as such instead of blaming the ruleset. With the marker at
          # exactly one and the total at exactly two, a passing run has exactly one private-key
          # finding, so the pass condition is unchanged either way.
          if [ "$pkey" -lt 1 ]; then
            echo "::error::the probe's throwaway private key was not reported by gitleaks' own private-key rule (gitleaks exit $rc, $total findings): the default ruleset is not in effect, so this scan is running on the injected marker rule alone and would miss every real secret"
            exit 1
          fi
          if [ "$total" -ne 2 ]; then
            echo "::error::the scan reported $total findings; exactly two (the probe's marker and its private key) were expected. Everything else is a secret in this history:"
            grep -E '^[[:space:]]*"(RuleID|File|Commit|StartLine|Fingerprint)": ' "$rep" >&2 || true
            exit 1
          fi
          # A floor, not the equality gate removed in e546f1e. Nothing here is compared to this
          # repository: gitleaks counts a commit only when its diff adds content, which is why
          # comparing its figure with `git rev-list` went red on honest pushes. The probe commit adds
          # two files, so it always counts one, and any non-empty checkout contributes at least one
          # more. This is false only when the walk was narrowed until the probe was all that was left
          # in it — which is what an --author or a --max-count filter written onto the line above
          # would do. It is a floor and nothing more: it does not measure coverage.
          count=${scanned%% *}
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::could not read a commit count from gitleaks' output; refusing to pass"
              exit 1
              ;;
          esac
          if [ "$count" -lt 2 ]; then
            echo "::error::gitleaks walked $count commit(s): the probe was scanned in isolation, so this is not a scan of this repository's history"
            exit 1
          fi
          echo "scan clean: two findings, the probe's marker on a ref the tip cannot reach and a default-rule hit on the probe's key, over $count commits"
