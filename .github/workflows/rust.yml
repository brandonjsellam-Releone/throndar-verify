name: Rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  tests:
    name: Parser tests (${{ matrix.toolchain }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.90.0", "1.97.1"]
        profile: [dev, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Locked doc tests
        run: cargo +${{ matrix.toolchain }} test --workspace --locked --all-features --doc --no-fail-fast --profile ${{ matrix.profile }}
      - name: Locked complete suite, examples and other targets
        run: cargo +${{ matrix.toolchain }} test --workspace --locked --all-features --all-targets --no-fail-fast --profile ${{ matrix.profile }}

  quality:
    name: Parser formatting and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 clippy --workspace --locked --all-targets --all-features -- -D warnings

  dependencies:
    name: Parser dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: mkdir .ci-tools
      - name: Fetch pinned audit source
        run: curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://static.crates.io/crates/cargo-audit/cargo-audit-0.22.2.crate --output .ci-tools/cargo-audit-0.22.2.crate
      - name: Check audit source and admitted dependency lock
        run: sha256sum --check tools/ci-audit-bootstrap/source.sha256
      - run: tar --extract --gzip --file .ci-tools/cargo-audit-0.22.2.crate --directory .ci-tools
      - run: cp tools/ci-audit-bootstrap/Cargo.lock .ci-tools/cargo-audit-0.22.2/Cargo.lock
      - name: Build audit with the reviewed resolution
        run: cargo +1.97.1 install --path .ci-tools/cargo-audit-0.22.2 --locked --root .ci-tools/install --target-dir .ci-tools/audit-target
      - name: Audit tool resolution against current advisories
        run: .ci-tools/install/bin/cargo-audit audit --deny warnings --file tools/ci-audit-bootstrap/Cargo.lock
      - name: Audit deny tool resolution before building it
        run: .ci-tools/install/bin/cargo-audit audit --deny warnings --file tools/ci-deny-bootstrap/Cargo.lock
      - name: Fetch pinned deny source
        run: curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://static.crates.io/crates/cargo-deny/cargo-deny-0.20.2.crate --output .ci-tools/cargo-deny-0.20.2.crate
      - name: Check deny source and admitted dependency lock
        run: sha256sum --check tools/ci-deny-bootstrap/source.sha256
      - run: tar --extract --gzip --file .ci-tools/cargo-deny-0.20.2.crate --directory .ci-tools
      - run: cp tools/ci-deny-bootstrap/Cargo.lock .ci-tools/cargo-deny-0.20.2/Cargo.lock
      - name: Build deny with the reviewed resolution
        run: cargo +1.97.1 install --path .ci-tools/cargo-deny-0.20.2 --locked --root .ci-tools/install --target-dir .ci-tools/deny-target
      - name: Audit product dependency lock
        run: .ci-tools/install/bin/cargo-audit audit --deny warnings --file Cargo.lock
      - name: Enforce product licenses, sources, advisories and crypto bans
        run: .ci-tools/install/bin/cargo-deny --locked --config deny.toml check
