name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly: catch Node-runtime drift on an otherwise dormant repo

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Usage prints (exit 2 is the documented usage exit)
        run: node dist/throndar-verify.mjs --help | grep -q USAGE
      - name: Malformed bundle must FAIL verification
        run: |
          echo '{}' > bad.json
          if node dist/throndar-verify.mjs bad.json; then
            echo "::error::malformed bundle unexpectedly passed"; exit 1
          fi
      - name: Co-signature gating regression test
        run: |
          node test/make-fixtures.mjs
          node test/cosignature.test.mjs

      # Everything above this line is satisfied WITHOUT running any cryptography. `{}` is
      # rejected by the kind dispatcher before ML-DSA, SLH-DSA or Merkle code executes, and the
      # repo carried no proof-bundle fixture at all, so `passes()` could be replaced wholesale
      # with `return true` and CI stayed green. --require-origin, the input action.yml documents
      # as the thing that "rejects anything not signed by a pinned Throndar key", appeared
      # nowhere. The steps below are the ones that reach the signature verifier.
      - name: A real proof bundle must VERIFY, with origin pinning
        run: node dist/throndar-verify.mjs --require-origin fixtures/demo-proof.json

      - name: Tampered bundles must FAIL (signature, payload, and origin)
        shell: bash
        run: |
          set -euo pipefail
          # Three independent mutations, each targeting a different control. A verifier that
          # short-circuits any one of them fails this step. Python is used rather than inline
          # JS because authoring JS is forbidden by the governing constitution (CLAUDE.md S0).
          python3 - <<'PY'
          import copy, json, pathlib

          src = json.loads(pathlib.Path("fixtures/demo-proof.json").read_text(encoding="utf-8"))

          def flip_hex(s, i=0):
              """Change one hex nibble, preserving length and alphabet."""
              c = "0" if s[i] != "0" else "1"
              return s[:i] + c + s[i + 1:]

          cases = {}

          # 1. Signature forgery: one nibble of the ML-DSA-87 signature.
          bad = copy.deepcopy(src)
          bad["receipt"]["sig"] = flip_hex(bad["receipt"]["sig"])
          cases["tampered-sig.json"] = bad

          # 2. Payload substitution: the answer no longer hashes to the signed digest.
          bad = copy.deepcopy(src)
          bad["answer"] = bad["answer"] + " (substituted)"
          cases["tampered-answer.json"] = bad

          # 3. Origin substitution. NOTE: flipping a nibble of the public key also breaks the
          #    SIGNATURE, so this bundle is rejected on signature grounds whether or not
          #    --require-origin is passed - it does NOT isolate the origin gate. It is kept because
          #    a corrupted key field must still fail closed, but the step below is what actually
          #    makes `signerRecognized` load-bearing.
          bad = copy.deepcopy(src)
          bad["receiptKey"]["public_key_hex"] = flip_hex(bad["receiptKey"]["public_key_hex"])
          cases["tampered-origin.json"] = bad

          for name, obj in cases.items():
              pathlib.Path(name).write_text(json.dumps(obj), encoding="utf-8")
              print(f"wrote {name}")
          PY

          for f in tampered-sig.json tampered-answer.json tampered-origin.json; do
            if node dist/throndar-verify.mjs --require-origin "$f"; then
              echo "::error::$f verified but must not have - a control is not being enforced"
              exit 1
            fi
            echo "  rejected as required: $f"
          done

      # The three mutations above all break the SIGNATURE, so `v.ok` is already false and each is
      # rejected before --require-origin can matter. Measured, not assumed: without the flag all
      # three still exit 1 with the same "signatures FAILED" message. Every origin predicate opens
      # with `if (!v.overallOk) return false;`, so signerRecognized IMPLIES ok by construction -
      # meaning the conjunct in `passes(v, requireOrigin)` can only bite on a bundle that is
      # ok=true AND signerRecognized=false. No input in this job was that bundle, so gutting the
      # gate to `return v.ok;` left the entire smoke job green.
      #
      # test/fixtures/dual-signed.json IS that bundle: valid signatures, signer not pinned.
      # make-fixtures.mjs generates it (it is gitignored, hence regenerated here rather than read
      # from the tree).
      - name: The origin gate must be the thing that rejects an unpinned signer
        shell: bash
        run: |
          set -euo pipefail
          node test/make-fixtures.mjs
          f=test/fixtures/dual-signed.json

          # WITHOUT the flag this must PASS. If it does not, the fixture is not the ok-but-unpinned
          # case and the assertion below would prove nothing - it would just be mutation #1 again.
          if ! node dist/throndar-verify.mjs "$f"; then
            echo "::error::$f must verify WITHOUT --require-origin; the check below is only"
            echo "::error::meaningful on a bundle whose signatures are valid"
            exit 1
          fi

          # Same bytes, same signatures, only the flag differs. The sole remaining reason to reject
          # is that the signer is not a pinned Throndar key - which is what action.yml documents
          # this flag as doing.
          if node dist/throndar-verify.mjs --require-origin "$f"; then
            echo "::error::--require-origin ACCEPTED a bundle signed by an unpinned key"
            exit 1
          fi
          echo "  origin gate is load-bearing: same bundle passes without the flag, fails with it"
