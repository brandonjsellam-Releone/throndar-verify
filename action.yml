# Throndar proof-verification GitHub Action.
#
# Fails the workflow if a Throndar proof bundle does not verify — the "don't trust
# us, verify it" doctrine as a CI gate. Verification is entirely OFFLINE (no network):
# the pre-built dist/throndar-verify.mjs bundle carries the isomorphic verifiers and
# Throndar's pinned published keys.
#
# Usage in a workflow:
#   - uses: ./tools/verify-cli          # (or your published <owner>/throndar-verify@v1)
#     with:
#       bundle: path/to/answer.throndar-proof.json
#       require-origin: "true"          # reject anything not signed by a pinned Throndar key
name: "Verify Throndar proof"
description: "Verify a Throndar answer/transcript/autopilot proof bundle offline; fail the build if it doesn't verify."
inputs:
  bundle:
    description: "Path to a proof-bundle JSON file — OR a directory, to verify every *.json inside it (fails if any fails)."
    required: true
  require-origin:
    description: "If 'true', fail unless the signer is a pinned Throndar key (not just internally-valid signatures)."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Verify proof bundle
      shell: bash
      # The inputs reach the script as ENVIRONMENT VALUES, never as script text.
      #
      # This step used to write `${{ inputs.bundle }}` and `${{ inputs.require-origin }}`
      # directly inside `run:`. The Actions runner expands those expressions into the
      # script TEXT before bash parses it, so a consumer who feeds this action anything
      # PR-derived — a per-branch bundle path, an entry from a changed-files list —
      # was handing every external PR author a shell on their runner, with that job's
      # GITHUB_TOKEN and any secret the step could see. The author of the script is
      # the one who can close that, which is why GitHub's hardening guide treats an
      # `${{ inputs.* }}` inside `run:` as the action's defect, not the consumer's.
      #
      # An env value is data to bash. The same payload in "$BUNDLE" is one literal
      # argument, which the verifier reports as an unreadable path and exits 1.
      # `github.action_path` stays inline: it is the runner's own checkout location
      # of this action, which no workflow input or event payload can influence.
      # test/verify-cli-action-injection.test.ts gates this file.
      env:
        BUNDLE: "${{ inputs.bundle }}"
        REQUIRE_ORIGIN: "${{ inputs.require-origin }}"
      run: |
        args=()
        if [ "$REQUIRE_ORIGIN" = "true" ]; then args+=(--require-origin); fi
        node "${{ github.action_path }}/dist/throndar-verify.mjs" "${args[@]}" "$BUNDLE"
